 // Same normalization used by the customer_link_summary DB view - keep in sync.
 function normalizeName(name) {
   if (!name) return '';
   let s = name.toUpperCase();
   s = s.replace(/[.,()&/]/g, ' ');
   s = s.replace(/\b(LTD|LIMITED|PLC|LLP|LLC|INC|CO|THE|COMPANY|GROUP)\b/g, '');
   s = s.replace(/\s+/g, ' ').trim();
   return s;
 }

 function esc(s) {
   return (s||'').toString().replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
 }
 function fmtDate(d) {
   if (!d) return null;
   return new Date(d + 'T00:00:00').toLocaleDateString('en-GB', { day: '2-digit', month: 'short', year: 'numeric' });
 }
 function fmtCharge(c) {
   const n = Number(c);
   if (!n) return null;
   return '£' + n.toLocaleString('en-GB', { maximumFractionDigits: 2 });
 }
 // Shared across Service History / Customer Overview - shown on the dashboard home screen.
 function trackRecentlyViewed(type, label, sub, url) {
   try {
     const key = 'na_recently_viewed';
     let list = JSON.parse(localStorage.getItem(key) || '[]');
     list = list.filter(item => item.url !== url);
     list.unshift({ type, label, sub, url, ts: Date.now() });
     localStorage.setItem(key, JSON.stringify(list.slice(0, 8)));
   } catch (e) {}
 }

 function isExpiringSoon(endDate) {
   if (!endDate) return false;
   const diff = (new Date(endDate + 'T00:00:00') - new Date()) / (1000*60*60*24);
   return diff >= 0 && diff <= 90;
 }

 // Same matcher used on Service History / Problem Trucks - keep in sync.
 const MODEL_IMAGES = [
   { match: [['hoppecke','batter']], file: 'hoppecke_battery.png' },
   { match: [['hoppecke','charg']], file: 'hoppecke_charger.png' },

 ];
 function getModelImage(makeModel) {
   if (!makeModel) return '15VN.png';
   const m = makeModel.toLowerCase();
   const isMatch = (alt) => Array.isArray(alt) ? alt.every(k => m.includes(k)) : m.includes(alt);
   for (const entry of MODEL_IMAGES) {
     if (entry.match.some(isMatch)) return entry.file;
   }

 }

 const ISSUE_CATEGORIES = [
   { key: 'brakes',      label: 'Brakes',           icon: '\u{1F6D1}', keywords: ['brake','handbrake','hand brake'] },
   { key: 'hydraulics',  label: 'Hydraulics & Leaks', icon: '\u{1F4A7}', keywords: ['hydraulic','hose','oil leak','cylinder','ram seal','spool valve','spool micro','leaking'] },
   { key: 'electrical',  label: 'Electrical',       icon: '\u26A1', keywords: ['electrical','wiring','contactor','fuse','battery','charger','connector','relay','microswitch','keyswitch'] },
   { key: 'mast',        label: 'Mast & Chains',    icon: '\u{1F4D0}', keywords: ['mast','chain','carriage','bearing','tilt','freelift','roller'] },
   { key: 'steering',    label: 'Steering',         icon: '\u{1F3AF}', keywords: ['steering','steer motor','orbital','w61','eps'] },
   { key: 'wheels',      label: 'Wheels & Tyres',   icon: '\u{1F6DE}', keywords: ['wheel','tyre','tire','puncture'] },
   { key: 'seat',        label: 'Seat',             icon: '\u{1FA91}', keywords: ['seat','cushion'] },
   { key: 'drive',       label: 'Motor & Drive',    icon: '\u2699\uFE0F', keywords: ['drive motor','gearbox','transmission','drive fault',' motor '] },
 ];

 function buildIssueCounts(jobs) {
   const counts = {};
   ISSUE_CATEGORIES.forEach(c => counts[c.key] = 0);
   jobs.forEach(job => {
     const blob = [job.short_desc, job.to_do, job.work_report].filter(Boolean).join(' \n ').toLowerCase();
     ISSUE_CATEGORIES.forEach(cat => { if (cat.keywords.some(kw => blob.includes(kw))) counts[cat.key]++; });
   });
   return ISSUE_CATEGORIES.map(c => ({ ...c, count: counts[c.key] })).filter(c => c.count > 0).sort((a,b) => b.count - a.count).slice(0, 6);
 }

 function classifyJobType(typeName) {
   const t = (typeName || '').toLowerCase();
   if (t.includes('breakdown')) return 'Breakdown';
   if (t.includes('service') || t.includes('preventative') || t.includes('inclusive')) return 'Service / PM';
   return 'Other';
 }

 async function fetchAll(table, matchFn, orFilter) {
   let all = [];
   let from = 0;
   const step = 1000;
   while (true) {
     let query = db.from(table).select('*').range(from, from + step - 1);
     if (orFilter) query = query.or(orFilter);
     const { data, error } = await query;
     if (error) throw error;
     all = all.concat(data || []);
     if (!data || data.length < step) break;
     from += step;
   }
   return matchFn ? all.filter(matchFn) : all;
 }

 function showSearchLanding() {
   const content = document.getElementById('content');
   content.innerHTML = `
     <div class="page-title">
       <div class="eyebrow">Portal Directory</div>
       <h1>Find a Customer</h1>
     </div>
     <div class="card" style="margin-top:20px;">
       <input type="text" id="landingSearch" placeholder="Start typing a company name…" autocomplete="off" spellcheck="false"
         style="width:100%; padding:14px 16px; border:1px solid var(--border); border-radius:10px; font-family:var(--body); font-size:16px; color:var(--text); outline:none;">
       <div id="landingResults" style="margin-top:12px;"></div>
     </div>
   `;
   const input = document.getElementById('landingSearch');
   const results = document.getElementById('landingResults');
   input.focus();
   let deb;
   input.addEventListener('input', () => {
     clearTimeout(deb);
     const term = input.value.trim();
     if (term.length < 2) { results.innerHTML = ''; return; }
     deb = setTimeout(async () => {
       results.innerHTML = '<div class="muted-cell">Searching…</div>';
       const { data, error } = await db.from('customers').select('id, company_name, postcode').ilike('company_name', `%${term}%`).order('company_name').limit(20);
       if (error) { results.innerHTML = '<div class="muted-cell">Search failed.</div>'; return; }
       if (!data || !data.length) { results.innerHTML = '<div class="muted-cell">No matches.</div>'; return; }
       results.innerHTML = data.map(c => `
         <div class="issue-row" style="cursor:pointer;" onclick="window.location.href='customer-overview.html?id=${c.id}'">
           <div class="issue-main">
             <div class="issue-top-line"><span class="issue-name">${esc(c.company_name)}</span><span class="muted-cell">${esc(c.postcode||'')}</span></div>
           </div>
         </div>
       `).join('');
     }, 200);
   });
 }

 async function loadCustomer() {
   const params = new URLSearchParams(window.location.search);
   const companyParam = params.get('company');
   const idParam = params.get('id');
   const content = document.getElementById('content');

   if (!companyParam && !idParam) {
     showSearchLanding();
     return;
   }

   try {
     let customer = null;
     if (idParam) {
       const { data, error } = await db.from('customers').select('*').eq('id', idParam).limit(1);
       if (error) throw error;
       customer = (data && data[0]) || null;
     } else {
       const { data, error } = await db.from('customers').select('*').ilike('company_name', companyParam).limit(1);
       if (error) throw error;
       customer = (data && data[0]) || null;
       if (!customer) {
         const { data: d2 } = await db.from('customers').select('*').ilike('company_name', `%${companyParam}%`).limit(1);
         customer = (d2 && d2[0]) || null;
       }
     }

     const displayName = (customer && customer.company_name) || companyParam || 'Unknown Customer';
     const norm = normalizeName(displayName);

     document.title = displayName + ' — Narrow Aisle';

     // Fetch related records - narrow with a server-side ilike first (cheap), then
     // confirm with an exact normalized-name match client-side to avoid false positives.
     const nameGuess = (displayName || '').replace(/'/g, "''");
     const orFilterEquip = `customer_name.ilike.%${nameGuess}%,site_name.ilike.%${nameGuess}%`;
     const orFilterContracts = `cust_name.ilike.%${nameGuess}%,site_name.ilike.%${nameGuess}%`;
     const orFilterHistory = `customer_name.ilike.%${nameGuess}%`;

     const [equipment, contracts, history] = await Promise.all([
       fetchAll('customer_equipment', r => normalizeName(r.customer_name) === norm || normalizeName(r.site_name) === norm, orFilterEquip).catch(() => []),
       fetchAll('maintenance_contracts', r => normalizeName(r.cust_name) === norm || normalizeName(r.site_name) === norm, orFilterContracts).catch(() => []),
       fetchAll('Service History', r => normalizeName(r.customer_name) === norm, orFilterHistory).catch(() => []),
     ]);

     render(customer, displayName, equipment, contracts, history);
     if (customer && customer.id) loadCrm(customer, displayName);
   } catch (err) {
     content.innerHTML = `<div class="empty-state">Couldn't load this customer.<br>${esc(err.message || err)}</div>`;
   }
 }

 function render(customer, displayName, equipment, contracts, history) {
   const content = document.getElementById('content');

   const contactBits = [];
   if (customer) {
     if (customer.address) contactBits.push(esc(customer.address));
     if (customer.postcode) contactBits.push(`<strong>${esc(customer.postcode)}</strong>`);
     if (customer.phone) contactBits.push(`<a href="tel:${esc((customer.phone||'').replace(/\s/g,''))}">${esc(customer.phone)}</a>`);
     if (customer.website) contactBits.push(`<a href="${esc(/^https?:\/\//i.test(customer.website)?customer.website:'https://'+customer.website)}" target="_blank" rel="noopener">${esc(customer.website)}</a>`);
   }
   if (!customer) contactBits.push('<em>Not found in Contacts — showing linked records only, matched by name.</em>');

   trackRecentlyViewed('customer', displayName, '', 'customer-overview.html?company=' + encodeURIComponent(displayName));

   const activeContracts = contracts.filter(c => !c.end_date || new Date(c.end_date) >= new Date());
   const expiringContracts = contracts.filter(c => isExpiringSoon(c.end_date));
   const breakdownVisits = history.filter(h => classifyJobType(h.job_type_name) === 'Breakdown').length;

   let html = `
     <div class="page-title">
       <div class="eyebrow">Portal Directory</div>
       <h1>${esc(displayName)}</h1>
     </div>
     <div class="contact-line">${contactBits.join(' &middot; ')}</div>

     ${customer && customer.id ? crmCardHtml(customer) : ''}

     <div class="stats-row">
       <div class="stat-card"><div class="stat-value neutral">${equipment.length}</div><div class="stat-label">Machines On File</div></div>
       <div class="stat-card"><div class="stat-value">${activeContracts.length}</div><div class="stat-label">Active Contracts</div></div>
       <div class="stat-card"><div class="stat-value neutral">${history.length}</div><div class="stat-label">Total Service Visits</div></div>
       <div class="stat-card"><div class="stat-value">${breakdownVisits}</div><div class="stat-label">Breakdown Callouts</div></div>
       ${expiringContracts.length ? `<div class="stat-card" style="border-color:rgba(223,10,30,0.3);"><div class="stat-value">${expiringContracts.length}</div><div class="stat-label">Contracts Expiring Soon</div></div>` : ''}
     </div>

     ${customer && customer.id ? crmSectionsHtml() : ''}
   `;

   if (history.length) {
     html += `
       <div class="section">
         <div class="charts-row">
           <div class="card chart-card"><div class="section-title" style="margin-bottom:14px;">Visits Over Time</div><canvas id="timelineChart"></canvas></div>
           <div class="card chart-card"><div class="section-title" style="margin-bottom:14px;">Visit Breakdown</div><div class="donut-wrap"><canvas id="typeChart"></canvas></div></div>
         </div>
         <div class="card">
           <div class="section-title" style="margin-bottom:4px;">Recurring Issues</div>
           <div class="section-note" style="margin-bottom:14px; display:block;">Patterns spotted across this customer's whole fleet</div>
           ${(() => {
             const issues = buildIssueCounts(history);
             if (!issues.length) return '<div class="no-issues">No recurring issue pattern detected.</div>';
             const max = issues[0].count;
             return issues.map(c => `
               <div class="issue-row">
                 <div class="issue-icon">${c.icon}</div>
                 <div class="issue-main">
                   <div class="issue-top-line"><span class="issue-name">${c.label}</span><span class="issue-count">${c.count} visit${c.count===1?'':'s'}</span></div>
                   <div class="issue-bar-track"><div class="issue-bar-fill" style="width:${Math.max(6,(c.count/max)*100)}%"></div></div>
                 </div>
               </div>`).join('');
           })()}
         </div>
       </div>
     `;
   }

   if (contracts.length) {
     html += `
       <div class="section">
         <div class="section-head"><div class="section-title">Maintenance Contracts (${contracts.length})</div></div>
         <div class="card" style="padding:0; overflow-x:auto;">
           <table class="data-table">
             <thead><tr><th>Type</th><th>Site</th><th>Equipment</th><th>Annual Charge</th><th>Start</th><th>End</th></tr></thead>
             <tbody>
               ${contracts.map(c => {
                 const expiring = isExpiringSoon(c.end_date);
                 const active = !c.end_date || new Date(c.end_date) >= new Date();
                 const badge = expiring ? '<span class="badge expiring">Expiring</span>' : (active ? '<span class="badge active">Active</span>' : '<span class="badge inactive">Ended</span>');
                 return `<tr>
                   <td>${esc(c.contract_type||'—')} ${badge}</td>
                   <td class="muted-cell">${esc(c.site_name||'—')}</td>
                   <td><span class="equip-tag">${esc(c.equip_code||'—')}</span></td>
                   <td>${fmtCharge(c.annual_charge) || '<span class="muted-cell">—</span>'}</td>
                   <td class="muted-cell">${fmtDate(c.start_date) || '—'}</td>
                   <td class="muted-cell">${fmtDate(c.end_date) || 'Ongoing'}</td>
                 </tr>`;
               }).join('')}
             </tbody>
           </table>
         </div>
       </div>
     `;
   }

   if (equipment.length) {
     html += `
       <div class="section">
         <div class="section-head"><div class="section-title">Equipment (${equipment.length})</div><div class="section-note">Click a machine to see its full service history</div></div>
         <div class="card" style="padding:0; overflow-x:auto;">
           <table class="data-table">
             <thead><tr><th></th><th>Equipment</th><th>Make / Model</th><th>Serial No</th><th>Site</th></tr></thead>
             <tbody>
               ${equipment.map(e => `
                 <tr class="clickable" onclick="window.location.href='service-history.html?serial=${encodeURIComponent(e.serial_no||e.equip_code||'')}'">
                   <td><img src="${getModelImage((e.make||'') + ' ' + (e.model||''))}" alt="" style="width:34px;height:34px;object-fit:contain;background:var(--surface2);border-radius:6px;border:1px solid var(--border);padding:2px;" onerror="this.style.display='none'"></td>
                   <td><span class="equip-tag">${esc(e.equip_code||'—')}</span></td>
                   <td>${esc(e.make||'')} ${esc(e.model||'')}</td>
                   <td class="muted-cell">${esc(e.serial_no||'—')}</td>
                   <td class="muted-cell">${esc(e.site_name||'—')}</td>
                 </tr>`).join('')}
             </tbody>
           </table>
         </div>
       </div>
     `;
   }

   if (!contracts.length && !equipment.length && !history.length) {
     html += `<div class="empty-state">No linked contracts, equipment, or service history found for this customer.<br>Matching is name-based, so slightly different spellings across systems can miss.</div>`;
   }

   content.innerHTML = html;
   if (history.length) drawCharts(history);
 }

 function drawCharts(jobs) {
   const byMonth = {};
   jobs.forEach(j => {
     if (!j.visit_date) return;
     const d = new Date(j.visit_date);
     if (isNaN(d)) return;
     const key = d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0');
     byMonth[key] = (byMonth[key]||0) + 1;
   });
   const monthKeys = Object.keys(byMonth).sort();
   const monthLabels = monthKeys.map(k => { const [y,m] = k.split('-'); return new Date(y, m-1, 1).toLocaleDateString('en-GB', { month:'short', year:'2-digit' }); });

   const timelineEl = document.getElementById('timelineChart');
   if (timelineEl && monthKeys.length) {
     new Chart(timelineEl, {
       type: 'bar',
       data: { labels: monthLabels, datasets: [{ data: monthKeys.map(k => byMonth[k]), backgroundColor: '#df0a1e', borderRadius: 4, maxBarThickness: 24 }] },
       options: { responsive:true, maintainAspectRatio:false, plugins:{legend:{display:false}},
         scales: { y:{beginAtZero:true, ticks:{precision:0, font:{size:10}}, grid:{color:'#f2f2f2'}}, x:{ticks:{font:{size:9}, maxRotation:0}, grid:{display:false}} } }
     });
   }

   const typeCounts = { 'Breakdown':0, 'Service / PM':0, 'Other':0 };
   jobs.forEach(j => typeCounts[classifyJobType(j.job_type_name)]++);
   const typeEl = document.getElementById('typeChart');
   if (typeEl) {
     new Chart(typeEl, {
       type: 'doughnut',
       data: { labels: Object.keys(typeCounts), datasets: [{ data: Object.values(typeCounts), backgroundColor: ['#df0a1e','#4caf50','#c0c0c0'], borderWidth:2, borderColor:'#fff' }] },
       options: { responsive:true, maintainAspectRatio:false, cutout:'68%', plugins:{legend:{position:'bottom', labels:{font:{size:10.5}, boxWidth:10, padding:12}}} }
     });
   }
 }

 loadCustomer();

 window.addEventListener('pageshow', (event) => {
   if (event.persisted) loadCustomer();
 });

 /* ============================================================
    CRM layer: account info, activity notes, follow-up tasks

 let CRM_USER_EMAIL = '';
 (async () => {
   try {
     const { data } = await db.auth.getUser();
     CRM_USER_EMAIL = (data && data.user && data.user.email) || '';
   } catch (e) {}
 })();

 const STATUS_OPTIONS = ['Prospect', 'Active', 'Lapsed', 'Lost'];

 function crmCardHtml(customer) {
   const status = customer.account_status || 'Active';
   const statusColor = status === 'Active' ? '#4caf50' : status === 'Prospect' ? '#f5a623' : status === 'Lapsed' ? '#9ca3af' : '#df0a1e';
   return `
     <div class="card" id="crmInfoCard" style="margin-bottom:24px;">
       <div class="section-head">
         <div class="section-title">Account</div>
         <button class="crm-btn-ghost" id="crmEditBtn" onclick="toggleCrmEdit()">Edit</button>
       </div>
       <div id="crmInfoView" style="display:flex; flex-wrap:wrap; gap:28px; font-size:13px;">
         <div><div class="section-note" style="margin-bottom:4px;">Status</div><span class="badge" style="background:${statusColor}1a; color:${statusColor};">${esc(status)}</span></div>
         <div><div class="section-note" style="margin-bottom:4px;">Primary Contact</div>${esc(customer.primary_contact_name) || '<span class="muted-cell">—</span>'}${customer.primary_contact_email ? ` &middot; <a href="mailto:${esc(customer.primary_contact_email)}">${esc(customer.primary_contact_email)}</a>` : ''}${customer.primary_contact_phone ? ` &middot; <a href="tel:${esc(customer.primary_contact_phone.replace(/\s/g,''))}">${esc(customer.primary_contact_phone)}</a>` : ''}</div>
         <div><div class="section-note" style="margin-bottom:4px;">Account Owner</div>${esc(customer.account_owner) || '<span class="muted-cell">—</span>'}</div>
       </div>
       <div id="crmInfoEdit" style="display:none; margin-top:4px;">
         <div style="display:grid; grid-template-columns:repeat(auto-fit,minmax(180px,1fr)); gap:12px; margin-bottom:14px;">
           <div>
             <div class="section-note" style="margin-bottom:4px;">Status</div>
             <select id="crmStatusInput" class="crm-input">${STATUS_OPTIONS.map(s => `<option value="${s}" ${s===status?'selected':''}>${s}</option>`).join('')}</select>
           </div>
           <div><div class="section-note" style="margin-bottom:4px;">Contact Name</div><input type="text" id="crmContactNameInput" class="crm-input" value="${esc(customer.primary_contact_name||'')}"></div>
           <div><div class="section-note" style="margin-bottom:4px;">Contact Email</div><input type="text" id="crmContactEmailInput" class="crm-input" value="${esc(customer.primary_contact_email||'')}"></div>
           <div><div class="section-note" style="margin-bottom:4px;">Contact Phone</div><input type="text" id="crmContactPhoneInput" class="crm-input" value="${esc(customer.primary_contact_phone||'')}"></div>
           <div><div class="section-note" style="margin-bottom:4px;">Account Owner</div><input type="text" id="crmOwnerInput" class="crm-input" value="${esc(customer.account_owner||'')}"></div>
         </div>
         <button class="crm-btn" onclick="saveCrmInfo(${customer.id})">Save</button>
         <button class="crm-btn-ghost" onclick="toggleCrmEdit()">Cancel</button>
       </div>
     </div>
     <style>
       .crm-input { width:100%; padding:9px 11px; border:1px solid var(--border); border-radius:8px; font-family:var(--body); font-size:13px; color:var(--text); outline:none; }
       .crm-input:focus { border-color:var(--red); }
       .crm-btn { padding:9px 16px; background:var(--red); color:#fff; border:none; border-radius:8px; font-family:var(--body); font-size:13px; font-weight:600; cursor:pointer; }
       .crm-btn:hover { background:#c00919; }
       .crm-btn-ghost { padding:9px 16px; background:none; border:1px solid var(--border); border-radius:8px; font-family:var(--body); font-size:12.5px; color:var(--muted); cursor:pointer; }
       .crm-btn-ghost:hover { color:var(--text); border-color:var(--border-hover, #999); }
       textarea.crm-input { resize:vertical; min-height:64px; font-family:var(--body); }
       .crm-item { padding:14px 0; border-bottom:1px solid var(--border); }
       .crm-item:last-child { border-bottom:none; }
       .crm-item-top { display:flex; justify-content:space-between; align-items:baseline; gap:10px; margin-bottom:5px; }
       .crm-type-tag { font-family:var(--mono); font-size:10px; letter-spacing:0.5px; text-transform:uppercase; color:var(--red); background:var(--red-dim); padding:2px 8px; border-radius:5px; }
       .crm-meta { font-family:var(--mono); font-size:11px; color:var(--muted); }
       .crm-task-row { display:flex; align-items:flex-start; gap:10px; padding:12px 0; border-bottom:1px solid var(--border); }
       .crm-task-row:last-child { border-bottom:none; }
       .crm-task-row input[type=checkbox] { width:18px; height:18px; margin-top:1px; accent-color: var(--red); cursor:pointer; flex-shrink:0; }
       .crm-task-title { font-size:13.5px; font-weight:600; }
       .crm-task-title.done { text-decoration:line-through; color:var(--muted); font-weight:400; }
       .crm-task-due { font-family:var(--mono); font-size:11px; color:var(--muted); margin-top:2px; }
       .crm-task-due.overdue { color:var(--red); }
     </style>
   `;
 }

 function toggleCrmEdit() {
   const view = document.getElementById('crmInfoView');
   const edit = document.getElementById('crmInfoEdit');
   const isEditing = edit.style.display !== 'none';
   view.style.display = isEditing ? 'flex' : 'none';
   edit.style.display = isEditing ? 'none' : 'block';
 }

 async function saveCrmInfo(customerId) {
   const patch = {
     account_status: document.getElementById('crmStatusInput').value,
     primary_contact_name: document.getElementById('crmContactNameInput').value.trim() || null,
     primary_contact_email: document.getElementById('crmContactEmailInput').value.trim() || null,
     primary_contact_phone: document.getElementById('crmContactPhoneInput').value.trim() || null,
     account_owner: document.getElementById('crmOwnerInput').value.trim() || null,
   };
   const { error } = await db.from('customers').update(patch).eq('id', customerId);
   if (error) { alert('Could not save: ' + error.message); return; }
   loadCustomer();
 }

 function crmSectionsHtml() {
   return `
     <div class="section">
       <div class="section-head"><div class="section-title">Open Tasks</div></div>
       <div class="card">
         <div id="crmTaskForm" style="display:flex; flex-wrap:wrap; gap:8px; margin-bottom:16px;">
           <input type="text" id="crmTaskTitle" class="crm-input" placeholder="Follow up about…" style="flex:2; min-width:180px;">
           <input type="date" id="crmTaskDue" class="crm-input" style="flex:1; min-width:130px;">
           <input type="text" id="crmTaskAssignee" class="crm-input" placeholder="Assigned to" style="flex:1; min-width:130px;">
           <button class="crm-btn" onclick="addCrmTask()">Add Task</button>
         </div>
         <div id="crmTaskList"><div class="muted-cell">Loading…</div></div>
       </div>
     </div>
     <div class="section">
       <div class="section-head"><div class="section-title">Notes & Activity</div></div>
       <div class="card">
         <div style="display:flex; flex-wrap:wrap; gap:8px; margin-bottom:16px;">
           <select id="crmNoteType" class="crm-input" style="flex:0 0 140px;">
             <option value="note">Note</option>
             <option value="call">Call</option>
             <option value="email">Email</option>
             <option value="site-visit">Site Visit</option>
           </select>
           <textarea id="crmNoteBody" class="crm-input" placeholder="What happened…" style="flex:1; min-width:220px;"></textarea>
         </div>
         <button class="crm-btn" onclick="addCrmNote()" style="margin-bottom:16px;">Add Note</button>
         <div id="crmNoteList"><div class="muted-cell">Loading…</div></div>
       </div>
     </div>
   `;
 }

 let CRM_CUSTOMER = null;

 async function loadCrm(customer, displayName) {
   CRM_CUSTOMER = customer;
   const [{ data: tasks, error: taskErr }, { data: notes, error: noteErr }] = await Promise.all([
     db.from('crm_tasks').select('*').eq('customer_id', customer.id).order('done').order('due_date', { ascending: true, nullsFirst: false }),
     db.from('crm_notes').select('*').eq('customer_id', customer.id).order('created_at', { ascending: false }),
   ]);
   renderCrmTasks(taskErr ? [] : (tasks || []));
   renderCrmNotes(noteErr ? [] : (notes || []));
 }

 function renderCrmTasks(tasks) {
   const el = document.getElementById('crmTaskList');
   if (!el) return;
   const open = tasks.filter(t => !t.done);
   const done = tasks.filter(t => t.done);
   if (!tasks.length) { el.innerHTML = '<div class="muted-cell">No tasks yet.</div>'; return; }
   const rowHtml = (t) => {
     const overdue = !t.done && t.due_date && new Date(t.due_date + 'T00:00:00') < new Date().setHours(0,0,0,0);
     return `
       <div class="crm-task-row">
         <input type="checkbox" ${t.done?'checked':''} onchange="toggleCrmTask(${t.id}, this.checked)">
         <div>
           <div class="crm-task-title ${t.done?'done':''}">${esc(t.title)}</div>
           <div class="crm-task-due ${overdue?'overdue':''}">${t.due_date ? 'Due ' + fmtDate(t.due_date) : 'No due date'}${t.assigned_to ? ' &middot; ' + esc(t.assigned_to) : ''}</div>
         </div>
       </div>`;
   };
   el.innerHTML = open.map(rowHtml).join('') + (done.length ? `<div class="section-note" style="margin:14px 0 4px;">Completed (${done.length})</div>${done.map(rowHtml).join('')}` : '');
 }

 function renderCrmNotes(notes) {
   const el = document.getElementById('crmNoteList');
   if (!el) return;
   if (!notes.length) { el.innerHTML = '<div class="muted-cell">No notes yet.</div>'; return; }
   const typeLabel = { note: 'Note', call: 'Call', email: 'Email', 'site-visit': 'Site Visit' };
   el.innerHTML = notes.map(n => `
     <div class="crm-item">
       <div class="crm-item-top">
         <span class="crm-type-tag">${esc(typeLabel[n.note_type] || n.note_type)}</span>
         <span class="crm-meta">${esc(n.created_by||'')}${n.created_by ? ' &middot; ' : ''}${new Date(n.created_at).toLocaleDateString('en-GB',{day:'2-digit',month:'short',year:'numeric'})}</span>
       </div>
       <div>${esc(n.body).replace(/\n/g,'<br>')}</div>
     </div>
   `).join('');
 }

 async function addCrmTask() {
   const title = document.getElementById('crmTaskTitle').value.trim();
   if (!title) return;
   const due_date = document.getElementById('crmTaskDue').value || null;
   const assigned_to = document.getElementById('crmTaskAssignee').value.trim() || null;
   const { error } = await db.from('crm_tasks').insert({
     customer_id: CRM_CUSTOMER.id,
     customer_name: CRM_CUSTOMER.company_name,
     title, due_date, assigned_to,
     created_by: CRM_USER_EMAIL || null,
   });
   if (error) { alert('Could not add task: ' + error.message); return; }
   document.getElementById('crmTaskTitle').value = '';
   document.getElementById('crmTaskDue').value = '';
   document.getElementById('crmTaskAssignee').value = '';
   loadCrm(CRM_CUSTOMER);
 }

 async function toggleCrmTask(taskId, done) {
   const { error } = await db.from('crm_tasks').update({ done, completed_at: done ? new Date().toISOString() : null }).eq('id', taskId);
   if (error) { alert('Could not update task: ' + error.message); return; }
   loadCrm(CRM_CUSTOMER);
 }

 async function addCrmNote() {
   const body = document.getElementById('crmNoteBody').value.trim();
   if (!body) return;
   const note_type = document.getElementById('crmNoteType').value;
   const { error } = await db.from('crm_notes').insert({
     customer_id: CRM_CUSTOMER.id,
     customer_name: CRM_CUSTOMER.company_name,
     note_type, body,
     created_by: CRM_USER_EMAIL || null,
   });
   if (error) { alert('Could not add note: ' + error.message); return; }
   document.getElementById('crmNoteBody').value = '';
   loadCrm(CRM_CUSTOMER);
 }
</script>
