<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#df0a1e">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@200;300;400;500;700;800&display=swap" rel="stylesheet">
<link rel="icon" href="icons/favicon.ico" sizes="any">
<link rel="icon" href="icons/favicon-32.png" type="image/png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<title>Set Your Password - Narrow Aisle Service Portal</title>
<style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { background: white !important; color-scheme: light only; }
    body {
        font-family: 'Barlow Condensed', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        color: #101010;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
    }

    .login-card {
        width: 100%;
        max-width: 380px;
        background: white;
        border: 1px solid #e8e8e8;
        border-radius: 14px;
        overflow: hidden;
    }

    .login-logo-panel {
        background: #df0a1e;
        padding: 32px;
        text-align: center;
    }

    .login-logo-panel img {
        height: 44px;
        max-width: 80%;
    }

    .login-card-body {
        padding: 40px 32px;
    }

    .login-brand { text-align: center; margin-bottom: 32px; }
    .login-brand-name { font-family: 'Barlow Condensed', 'IBM Plex Sans', sans-serif; font-size: 32px; font-weight: 200; letter-spacing: 1.5px; text-transform: uppercase; color: #101010; }
    .login-brand-name span { color: #101010; }
    .login-brand-tag { font-size: 12px; color: #707070; margin-top: 4px; text-transform: uppercase; letter-spacing: 0.6px; }

    .login-title { font-family: 'Barlow Condensed', sans-serif; font-size: 18px; font-weight: 700; margin-bottom: 8px; text-align: center; }
    .login-sub { font-size: 13px; color: #707070; text-align: center; margin-bottom: 24px; line-height: 1.5; }

    .field { margin-bottom: 16px; }
    .field label { display: block; font-size: 11px; font-weight: 600; color: #606060; text-transform: uppercase; letter-spacing: 0.4px; margin-bottom: 6px; }
    .field input {
        width: 100%;
        font-family: 'Barlow Condensed', sans-serif;
        font-size: 15px;
        padding: 12px 14px;
        border: 1px solid #ddd;
        border-radius: 8px;
        color: #101010;
    }
    .field input:focus { outline: none; border-color: #df0a1e; }

    .login-btn {
        width: 100%;
        padding: 13px;
        background: #df0a1e;
        border: none;
        border-radius: 8px;
        color: white;
        font-family: 'Barlow Condensed', sans-serif;
        font-size: 13px;
        font-weight: 700;
        text-transform: uppercase;
        letter-spacing: 0.4px;
        cursor: pointer;
        transition: all 0.2s ease;
        margin-top: 8px;
    }
    .login-btn:hover { background: #c3161e; }
    .login-btn:disabled { opacity: 0.6; cursor: not-allowed; }

    .login-msg { font-size: 13px; text-align: center; margin-top: 16px; min-height: 0; }
    .login-msg.error { color: #df0a1e; }
    .login-msg.success { color: #4caf50; }

    .spinner-state { text-align: center; color: #707070; font-size: 14px; padding: 20px 0; }
</style>
</head>
<body>

<div class="login-card">
    <div class="login-logo-panel">
        <img src="flexi-logo-white.svg" alt="Narrow Aisle">
    </div>
    <div class="login-card-body">
    <div class="login-brand">
        <div class="login-brand-name">Narrow <span>Aisle</span></div>
        <div class="login-brand-tag">Service Portal</div>
    </div>

    <div id="verifyingState" class="spinner-state">Verifying your link...</div>

    <div id="formState" style="display:none;">
        <div class="login-title">Set your password</div>
        <div class="login-sub" id="welcomeMsg">Choose a password to finish setting up your account.</div>

        <form id="setPasswordForm">
            <div class="field">
                <label for="password">New Password</label>
                <input type="password" id="password" autocomplete="new-password" required minlength="8">
            </div>
            <div class="field">
                <label for="password2">Confirm Password</label>
                <input type="password" id="password2" autocomplete="new-password" required minlength="8">
            </div>
            <button type="submit" class="login-btn" id="submitBtn">Set Password &amp; Continue</button>
        </form>
    </div>

    <div id="errorState" style="display:none;" class="spinner-state"></div>

    <div class="login-msg" id="msgEl"></div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
    // ===== Supabase project config =====
    const SUPABASE_URL = 'https://dontubctlexlvifwhmbj.supabase.co';
    const SUPABASE_KEY = 'sb_publishable_99HLzSv4wMwFZHlR81yIsQ_z0A0Jpth';
    const db = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
    // =====================================

    const verifyingEl = document.getElementById('verifyingState');
    const formEl = document.getElementById('formState');
    const errorEl = document.getElementById('errorState');
    const msgEl = document.getElementById('msgEl');

    function showMsg(text, type) {
        msgEl.textContent = text;
        msgEl.className = 'login-msg ' + type;
    }

    function showError(text) {
        verifyingEl.style.display = 'none';
        formEl.style.display = 'none';
        errorEl.style.display = 'block';
        errorEl.textContent = text;
    }

    (async () => {
        const params = new URLSearchParams(window.location.search);
        const tokenHash = params.get('token_hash');
        const type = params.get('type');

        if (!tokenHash || !type) {
            showError('This link is missing required information. Please use the link from your email directly, or request a new one.');
            return;
        }

        const { data, error } = await db.auth.verifyOtp({ token_hash: tokenHash, type: type });

        if (error) {
            showError('This link has expired or already been used. Please request a new invite or password reset.');
            return;
        }

        const user = data.user;
        const name = (user && user.user_metadata && user.user_metadata.full_name) || (user && user.email) || '';
        document.getElementById('welcomeMsg').textContent = name
            ? `Welcome, ${name.split(' ')[0]} — choose a password to finish setting up your account.`
            : 'Choose a password to finish setting up your account.';

        verifyingEl.style.display = 'none';
        formEl.style.display = 'block';
    })();

    document.getElementById('setPasswordForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        const p1 = document.getElementById('password').value;
        const p2 = document.getElementById('password2').value;
        const btn = document.getElementById('submitBtn');

        if (p1 !== p2) {
            showMsg('Passwords don\'t match.', 'error');
            return;
        }
        if (p1.length < 8) {
            showMsg('Password must be at least 8 characters.', 'error');
            return;
        }

        btn.disabled = true;
        btn.textContent = 'Saving...';
        showMsg('', '');

        const { error } = await db.auth.updateUser({ password: p1 });

        if (error) {
            btn.disabled = false;
            btn.textContent = 'Set Password & Continue';
            showMsg(error.message, 'error');
            return;
        }

        const { data: { user } } = await db.auth.getUser();
        if (user) {
            const meta = user.user_metadata || {};
            localStorage.setItem('portalUser', user.email);
            localStorage.setItem('portalName', meta.full_name || user.email.split('@')[0]);
            localStorage.setItem('portalRole', meta.role || 'Field Engineer');
            localStorage.setItem('portalLoginTime', new Date().toLocaleString('en-GB'));
        }

        showMsg('Password set! Taking you in...', 'success');
        setTimeout(() => { window.location.href = 'portal-hub-professional.html'; }, 1200);
    });
</script>
</body>
</html>
