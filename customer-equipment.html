<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
   <script type="module" src="auth-guard.js"></script>
<meta name="theme-color" content="#df0a1e">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;600;700&family=DM+Sans:wght@400;500;700&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<title>Customer Equipment - Narrow Aisle Service Portal</title>
<style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { background: white !important; color-scheme: light only; }
    body {
        font-family: 'DM Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        color: #101010;
        min-height: 100vh;
    }

    .header {
        background: linear-gradient(135deg, #ffffff 0%, #fafafa 100%);
        border-bottom: 3px solid #df0a1e;
        padding: 24px 32px;
        position: sticky;
        top: 0;
        z-index: 50;
    }

    .back-link { font-size: 12px; color: #707070; text-decoration: none; font-weight: 600; }
    .back-link:hover { color: #df0a1e; }

    .header-title { font-family: 'IBM Plex Sans', sans-serif; font-size: 28px; font-weight: 700; margin-top: 4px; }
    .header-subtitle { font-size: 13px; color: #707070; margin-top: 2px; }

    .content { max-width: 1000px; margin: 0 auto; padding: 32px; }

    .search-panel {
        background: white;
        border: 1px solid #e8e8e8;
        border-radius: 12px;
        padding: 24px;
        margin-bottom: 24px;
        display: flex;
        gap: 12px;
    }

    .search-panel input {
        flex: 1;
        font-family: 'DM Mono', monospace;
        font-size: 16px;
        padding: 14px 16px;
        border: 1px solid #ddd;
        border-radius: 8px;
        color: #101010;
    }

    .search-panel input:focus { outline: none; border-color: #df0a1e; }

    .search-btn {
        padding: 14px 28px;
        background: #df0a1e;
        border: none;
        border-radius: 8px;
        color: white;
        font-family: 'IBM Plex Sans', sans-serif;
        font-size: 13px;
        font-weight: 700;
        text-transform: uppercase;
        letter-spacing: 0.3px;
        cursor: pointer;
        transition: all 0.2s ease;
    }
    .search-btn:hover { background: #c3161e; }
    .search-btn:disabled { opacity: 0.6; cursor: not-allowed; }

    .result-count {
        font-family: 'DM Mono', monospace;
        font-size: 12px;
        color: #707070;
        margin-bottom: 16px;
        text-transform: uppercase;
        letter-spacing: 0.3px;
    }

    .equip-card {
        background: white;
        border: 1px solid #e8e8e8;
        border-left: 4px solid #df0a1e;
        border-radius: 10px;
        padding: 20px 24px;
        margin-bottom: 14px;
    }

    .equip-card:hover { box-shadow: 0 8px 24px rgba(223,10,30,0.1); }

    .equip-top {
        display: flex;
        justify-content: space-between;
        align-items: flex-start;
        gap: 16px;
        margin-bottom: 8px;
    }

    .equip-title { font-family: 'IBM Plex Sans', sans-serif; font-size: 16px; font-weight: 700; }

    .equip-serial { font-family: 'DM Mono', monospace; font-size: 12px; color: #df0a1e; font-weight: 500; white-space: nowrap; }

    .equip-meta { font-size: 13px; color: #707070; display: flex; gap: 16px; flex-wrap: wrap; margin-top: 4px; }
    .equip-meta span strong { color: #101010; font-weight: 600; }

    .equip-address { font-size: 13px; color: #707070; margin-top: 10px; padding-top: 10px; border-top: 1px solid #f0f0f0; }

    .hire-badge {
        display: inline-block;
        font-family: 'IBM Plex Sans', sans-serif;
        font-size: 10px;
        font-weight: 700;
        text-transform: uppercase;
        letter-spacing: 0.3px;
        color: #df0a1e;
        background: #fff0f1;
        border-radius: 4px;
        padding: 3px 8px;
        margin-left: 8px;
        vertical-align: middle;
    }

    .empty-state, .loading-state {
        text-align: center;
        padding: 60px 20px;
        color: #909090;
        font-size: 14px;
    }

    @media (max-width: 640px) {
        .header { padding: 16px 20px; }
        .header-title { font-size: 22px; }
        .content { padding: 16px; }
        .search-panel { flex-direction: column; }
        .equip-top { flex-direction: column; }
    }
</style>
</head>
<body>

<div class="header">
    <a class="back-link" href="portal-hub-professional.html">&larr; Back to Portal</a>
    <div class="header-title">Customer Equipment</div>
    <div class="header-subtitle">Search equipment owned by a customer</div>
</div>

<div class="content">
    <div class="search-panel">
        <input type="text" id="customerInput" placeholder="Enter customer name..." autofocus>
        <button class="search-btn" id="searchBtn">Search</button>
    </div>

    <div id="resultsWrap"></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
    if (!localStorage.getItem('portalUser')) {
        window.location.href = 'login.html';
    }

    // ===== Supabase project config =====
    const SUPABASE_URL = 'https://hkwcdpqpduptjwroawrw.supabase.co';
    const SUPABASE_KEY = 'sb_publishable_ym0_ostk5WkdHGhGEGSkXw_d1sHadPY';
    const db = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
    // =====================================

    function renderResults(items) {
        const wrap = document.getElementById('resultsWrap');

        if (!items.length) {
            wrap.innerHTML = '<div class="empty-state">No equipment found for that customer.</div>';
            return;
        }

        wrap.innerHTML = `<div class="result-count">${items.length} record${items.length === 1 ? '' : 's'} found</div>` +
            items.map(item => `
                <div class="equip-card">
                    <div class="equip-top">
                        <div class="equip-title"><a href="truck.html?equip=${encodeURIComponent(item.equip_no)}" style="color:inherit;text-decoration:none;">${item.manufacturer || ''} ${item.model || ''}</a>${item.on_hire ? '<span class="hire-badge">On Hire</span>' : ''}</div>
                        <div class="equip-serial">${item.serial_no || '—'}</div>
                    </div>
                    <div class="equip-meta">
                        <span><strong>Customer:</strong> ${item.account_name || '—'}</span>
                        <span><strong>Site:</strong> ${item.site_name || '—'}</span>
                        <span><strong>Site Ref:</strong> ${item.site_ref || '—'}</span>
                        <span><strong>Equip No:</strong> ${item.equip_no || '—'}</span>
                    </div>
                    <div class="equip-address">${item.site_address || '—'}</div>
                </div>
            `).join('');
    }

    async function runSearch() {
        const customer = document.getElementById('customerInput').value.trim();
        if (!customer) return;

        const btn = document.getElementById('searchBtn');
        btn.disabled = true;
        btn.textContent = 'Searching...';
        document.getElementById('resultsWrap').innerHTML = '<div class="loading-state">Searching customer equipment...</div>';

        try {
            const [ceRes, hireRes] = await Promise.all([
                db.from('customer_equipment')
                    .select('*')
                    .ilike('account_name', `%${customer}%`)
                    .order('account_name', { ascending: true }),
                db.from('equipment_on_hire')
                    .select('equip_no,account_name,site_name,site_address,make_model,serial_no')
                    .ilike('account_name', `%${customer}%`)
                    .order('account_name', { ascending: true })
            ]);
            if (ceRes.error && hireRes.error) throw ceRes.error;

            const owned = ceRes.data || [];
            const ownedEquipNos = new Set(owned.map(r => r.equip_no));

            // Hire trucks are a separate table (no manufacturer/model split, no site_ref) --
            // normalise to the same shape and tag them so they don't look like owned equipment.
            const hire = (hireRes.data || [])
                .filter(r => !ownedEquipNos.has(r.equip_no)) // avoid double-listing if it's already in customer_equipment
                .map(r => {
                    const [manufacturer, ...rest] = (r.make_model || '').split('/');
                    return {
                        equip_no: r.equip_no,
                        manufacturer: manufacturer || '',
                        model: rest.join('/') || r.make_model || '',
                        serial_no: r.serial_no,
                        account_name: r.account_name,
                        site_name: r.site_name,
                        site_ref: '',
                        site_address: r.site_address,
                        on_hire: true
                    };
                });

            renderResults([...owned, ...hire]);
        } catch (err) {
            document.getElementById('resultsWrap').innerHTML = '<div class="empty-state">Could not reach Supabase.<br>' + (err.message || err) + '</div>';
        } finally {
            btn.disabled = false;
            btn.textContent = 'Search';
        }
    }

    document.getElementById('searchBtn').addEventListener('click', runSearch);
    document.getElementById('customerInput').addEventListener('keydown', e => {
        if (e.key === 'Enter') runSearch();
    });

    // jump straight into a search when arriving from the dashboard quick search
    const urlParams = new URLSearchParams(window.location.search);
    const customerParam = urlParams.get('customer');
    if (customerParam) {
        document.getElementById('customerInput').value = customerParam;
        runSearch();
    }
</script>
</body>
</html>
