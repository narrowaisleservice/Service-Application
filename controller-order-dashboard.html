<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
  <script type="module" src="auth-guard.js"></script>
<title>Controller Orders — Narrow Aisle Service Portal</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=DM+Sans:wght@400;500;700&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root{
    --red:#df0a1e;
    --black:#0a0a0a;
    --white:#ffffff;
    --gray-line:#e6e6e6;
    --gray-fill:#f6f6f6;
    --gray-text:#6b6b6b;
    --amber:#b8860b;
    --green:#1a7d3c;
    --font-display:'Barlow Condensed',sans-serif;
    --font-body:'DM Sans',sans-serif;
    --font-mono:'DM Mono',monospace;
  }
  *{box-sizing:border-box;}
  body{ margin:0; background:var(--gray-fill); font-family:var(--font-body); color:var(--black); visibility:hidden; }
  header{
    background:var(--black); color:var(--white); padding:18px 24px;
    display:flex; align-items:center; justify-content:space-between;
    position:sticky; top:0; z-index:10;
  }
  header .header-left{
    display:flex;
    align-items:center;
    gap:12px;
    min-width:0;
  }
  .back-btn{
    background:none;
    border:none;
    color:var(--white);
    cursor:pointer;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:4px;
    border-radius:6px;
    flex-shrink:0;
  }
  .back-btn:hover, .back-btn:active{
    color:var(--red);
    background:rgba(255,255,255,0.08);
  }
  header .title{ font-family:var(--font-display); font-weight:700; font-size:22px; }
  header .title small{
    display:block; font-family:var(--font-mono); font-size:11px; font-weight:400;
    color:#b0b0b0; letter-spacing:0.5px; margin-top:2px;
  }
  .user-bar{
    background:var(--white); border-bottom:1px solid var(--gray-line);
    padding:8px 24px; display:flex; align-items:center; justify-content:space-between;
    font-family:var(--font-mono); font-size:12px; color:var(--gray-text);
  }
  .user-bar button{
    background:none; border:none; color:var(--red); font-family:var(--font-mono);
    font-size:12px; cursor:pointer; text-decoration:underline; padding:0;
  }
  .tabs{ display:flex; gap:6px; background:var(--white); padding:6px; border-bottom:1px solid var(--gray-line); }
  .tab{
    flex:1; text-align:center; padding:10px; font-family:var(--font-display);
    font-weight:600; font-size:15px; border-radius:8px; cursor:pointer; color:var(--gray-text);
  }
  .tab.active{ background:var(--red); color:var(--white); }
  .filter-bar{ background:var(--white); padding:10px 16px; border-bottom:1px solid var(--gray-line); display:flex; gap:8px; }
  #filterInput{
    flex:1; border:1px solid var(--gray-line); border-radius:8px;
    padding:10px 12px; font-family:var(--font-body); font-size:14px;
    background:var(--white); color:var(--black);
  }
  #filterInput:focus{ outline:none; border-color:var(--red); box-shadow:0 0 0 3px rgba(223,10,30,0.08); }
  #refreshBtn{
    flex-shrink:0; width:40px; border:1px solid var(--gray-line); border-radius:8px;
    background:var(--white); color:var(--gray-text); font-size:16px; cursor:pointer;
  }
  #refreshBtn:hover{ color:var(--red); border-color:var(--red); }
  #refreshBtn:disabled{ opacity:0.5; cursor:not-allowed; }
  .stats-bar{
    max-width:820px; margin:0 auto; padding:12px 16px 0;
    font-family:var(--font-mono); font-size:12px; color:var(--gray-text);
  }
  main{ max-width:820px; margin:0 auto; padding:8px 16px 90px; }
  #empty{ text-align:center; color:var(--gray-text); padding:60px 20px; font-size:14px; }

  .card{ background:var(--white); border-radius:12px; border:1px solid var(--gray-line); margin-bottom:16px; overflow:hidden; }
  .card.stale{ border-left:4px solid var(--amber); }
  .card.cancelled{ opacity:0.6; }
  .card-head{ padding:14px 16px 10px; display:flex; align-items:flex-start; gap:10px; }
  .card-head .info{ flex:1; min-width:0; }
  .card-head h3{ font-family:var(--font-display); font-size:20px; margin:0 0 2px; }
  .bulk-check{ width:20px; height:20px; margin-top:2px; flex-shrink:0; accent-color:var(--red); }
  .checkbox-spacer{ width:20px; flex-shrink:0; }
  .meta{ font-family:var(--font-mono); font-size:12px; color:var(--gray-text); line-height:1.6; }
  .stale-badge{ color:var(--amber); font-weight:600; }
  .badge-urgent{
    background:var(--red); color:var(--white); font-family:var(--font-mono); font-size:11px; font-weight:600;
    padding:2px 8px; border-radius:10px; margin-left:8px; vertical-align:middle; display:inline-block;
  }
  .badge-cancelled{
    background:var(--gray-text); color:var(--white); font-family:var(--font-mono); font-size:11px; font-weight:600;
    padding:2px 8px; border-radius:10px; margin-left:8px; vertical-align:middle; display:inline-block;
  }

  .timeline{ display:flex; align-items:center; padding:4px 16px 16px; }
  .tl-step{ display:flex; flex-direction:column; align-items:center; flex:1; position:relative; }
  .tl-dot{
    width:22px; height:22px; border-radius:50%; background:var(--gray-line);
    display:flex; align-items:center; justify-content:center; font-size:12px; color:var(--white);
    font-family:var(--font-mono); font-weight:500; z-index:1;
  }
  .tl-dot.done{ background:var(--green); }
  .tl-dot.current{ background:var(--red); }
  .tl-label{ font-family:var(--font-display); font-weight:600; font-size:12px; margin-top:6px; color:var(--gray-text); text-transform:uppercase; letter-spacing:0.3px; }
  .tl-label.active{ color:var(--black); }
  .tl-line{ position:absolute; top:11px; left:50%; width:100%; height:2px; background:var(--gray-line); z-index:0; }
  .tl-line.done{ background:var(--green); }
  .tl-step:last-child .tl-line{ display:none; }

  .items{ padding:0 16px 12px; }
  .items table{ width:100%; border-collapse:collapse; font-size:13px; }
  .items th{ text-align:left; font-family:var(--font-display); font-weight:600; font-size:12px; color:var(--gray-text); padding:4px 6px; border-bottom:1px solid var(--gray-line); }
  .items td{ padding:6px; border-bottom:1px solid var(--gray-line); }
  .items td.pn{ font-family:var(--font-mono); font-size:12px; color:var(--red); white-space:nowrap; }
  .items td.qty{ text-align:right; font-family:var(--font-mono); }

  .notes-line{ padding:0 16px 12px; font-size:13px; color:var(--gray-text); font-style:italic; }
  .photo-line{ padding:0 16px 12px; }
  .photo-line img{ max-width:120px; max-height:120px; border-radius:8px; border:1px solid var(--gray-line); cursor:pointer; }

  .action-bar{ border-top:1px solid var(--gray-line); padding:12px 16px; background:var(--gray-fill); display:flex; justify-content:flex-end; gap:8px; flex-wrap:wrap; }
  button.advance{
    background:var(--red); color:var(--white); border:none; padding:10px 18px;
    border-radius:8px; font-family:var(--font-display); font-weight:600; font-size:14px; cursor:pointer;
  }
  button.advance:disabled{ background:#e5a2a8; cursor:not-allowed; }
  .btn-edit, .btn-cancel{
    font-family:var(--font-display); font-weight:600; font-size:14px; border-radius:8px;
    padding:10px 16px; cursor:pointer; text-decoration:none; display:inline-flex; align-items:center;
  }
  .btn-edit{ background:var(--white); color:var(--black); border:1px solid var(--gray-line); }
  .btn-cancel{ background:var(--white); color:var(--gray-text); border:1px solid var(--gray-line); }
  .btn-cancel:hover{ color:var(--red); border-color:var(--red); }

  .bulk-bar{
    position:fixed; left:0; right:0; bottom:0; background:var(--black); color:var(--white);
    padding:12px 16px calc(12px + env(safe-area-inset-bottom)); display:flex; align-items:center;
    justify-content:space-between; gap:10px; z-index:20;
  }
  .bulk-bar span{ font-family:var(--font-mono); font-size:13px; flex-shrink:0; }
  .bulk-bar button{ font-family:var(--font-display); font-weight:600; font-size:13px; padding:8px 14px; border-radius:6px; cursor:pointer; border:none; }
  #bulkActionBtn{ background:var(--red); color:var(--white); flex:1; }
  #bulkActionBtn:disabled{ background:#5a5a5a; cursor:not-allowed; }
  #bulkClearBtn{ background:none; color:var(--white); border:1px solid rgba(255,255,255,0.3); }
</style>
</head>
<body>

<header>
  <div class="header-left">
    <button type="button" class="back-btn" id="backBtn" aria-label="Go back">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
    </button>
    <div class="title">Controller Orders<small>NARROW AISLE SERVICE PORTAL</small></div>
  </div>
</header>
<div class="user-bar">
  <span id="userEmail"></span>
  <button type="button" id="logoutBtn">Log out</button>
</div>

<div class="tabs">
  <div class="tab active" data-filter="active">Active</div>
  <div class="tab" data-filter="Sent">Sent</div>
  <div class="tab" data-filter="all">All</div>
</div>
<div class="filter-bar">
  <input type="text" id="filterInput" placeholder="Search by truck, controller, or engineer...">
  <button type="button" id="refreshBtn" aria-label="Refresh">↻</button>
</div>
<div class="stats-bar" id="statsBar"></div>

<main>
  <div id="list"></div>
  <div id="empty" style="display:none;">Nothing here.</div>
</main>

<div class="bulk-bar" id="bulkBar" style="display:none;">
  <span id="bulkCount"></span>
  <button type="button" id="bulkActionBtn">Mark</button>
  <button type="button" id="bulkClearBtn">Clear</button>
</div>

<script>
const SUPABASE_URL = 'https://dontubctlexlvifwhmbj.supabase.co';
const SUPABASE_KEY = 'sb_publishable_99HLzSv4wMwFZHlR81yIsQ_z0A0Jpth';
const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

const STAGES = ['Ordered', 'Picked', 'Sent'];
let orders = [];
let itemsByOrder = {};
let currentFilter = 'active';
let currentSearch = '';
let selectedIds = new Set();

document.getElementById('backBtn').addEventListener('click', () => {
  if (document.referrer && new URL(document.referrer).host === location.host) {
    history.back();
  } else {
    window.location.href = 'portal-hub-professional.html';
  }
});

(async () => {
  const { data: { session } } = await sb.auth.getSession();
  if (!session) {
    window.location.href = 'login.html?redirect=' + encodeURIComponent(location.pathname.split('/').pop());
    return;
  }
  document.getElementById('userEmail').textContent = 'Logged in as ' + session.user.email;
  document.body.style.visibility = 'visible';
  loadOrders();
})();

sb.auth.onAuthStateChange((event, session) => {
  if (event === 'SIGNED_OUT' || !session) {
    window.location.href = 'login.html';
  }
});

document.getElementById('logoutBtn').addEventListener('click', async () => {
  await sb.auth.signOut();
  window.location.href = 'login.html';
});

async function loadOrders() {
  const emptyEl = document.getElementById('empty');
  emptyEl.textContent = 'Loading orders…';
  emptyEl.style.display = 'block';
  document.getElementById('list').innerHTML = '';

  const { data: orderData, error: orderErr } = await sb
    .from('controller_orders')
    .select('*')
    .order('created_at', { ascending: false });

  if (orderErr) {
    emptyEl.textContent = "Couldn't load orders — check your connection.";
    console.error(orderErr);
    return;
  }
  orders = orderData;

  const { data: itemData, error: itemErr } = await sb
    .from('controller_order_items')
    .select('*');

  if (itemErr) {
    console.error(itemErr);
  } else {
    itemsByOrder = {};
    (itemData || []).forEach(it => {
      if (!itemsByOrder[it.order_id]) itemsByOrder[it.order_id] = [];
      itemsByOrder[it.order_id].push(it);
    });
  }

  render();
}

// Human-friendly "how long has this been sitting here" for the current stage.
function timeAgo(dateStr) {
  if (!dateStr) return '';
  const hours = (Date.now() - new Date(dateStr).getTime()) / 3600000;
  if (hours < 1) return 'just now';
  if (hours < 24) return `${Math.floor(hours)}h ago`;
  return `${Math.floor(hours / 24)}d ago`;
}

function updateTabCounts() {
  const activeCount = orders.filter(o => o.status !== 'Sent' && !o.cancelled_at).length;
  const sentCount = orders.filter(o => o.status === 'Sent').length;
  document.querySelector('.tab[data-filter="active"]').textContent = `Active (${activeCount})`;
  document.querySelector('.tab[data-filter="Sent"]').textContent = `Sent (${sentCount})`;
  document.querySelector('.tab[data-filter="all"]').textContent = `All (${orders.length})`;
}

function updateStatsBar() {
  const activeOrders = orders.filter(o => o.status !== 'Sent' && !o.cancelled_at);
  const activeCount = activeOrders.length;

  let oldestText = '';
  if (activeCount > 0) {
    const oldest = activeOrders.reduce((a, b) => new Date(a.created_at) < new Date(b.created_at) ? a : b);
    oldestText = ` · Oldest active: ${timeAgo(oldest.created_at)}`;
  }

  const sentOrders = orders.filter(o => o.status === 'Sent' && o.sent_at);
  let avgText = '';
  if (sentOrders.length > 0) {
    const totalHours = sentOrders.reduce((sum, o) => sum + (new Date(o.sent_at) - new Date(o.created_at)) / 3600000, 0);
    const avgHours = totalHours / sentOrders.length;
    avgText = ` · Avg time to Sent: ${avgHours < 1 ? '<1h' : Math.round(avgHours) + 'h'}`;
  }

  document.getElementById('statsBar').textContent = `${activeCount} active${oldestText}${avgText}`;
}

function render() {
  updateTabCounts();
  updateStatsBar();

  const listEl = document.getElementById('list');
  const emptyEl = document.getElementById('empty');

  const search = currentSearch.toLowerCase();
  let filtered = orders.filter(o => {
    if (currentFilter === 'active' && (o.status === 'Sent' || o.cancelled_at)) return false;
    if (currentFilter !== 'all' && currentFilter !== 'active' && o.status !== currentFilter) return false;
    if (search) {
      const hay = `${o.truck_serial || ''} ${o.controller_name || ''} ${o.engineer_name || ''}`.toLowerCase();
      if (!hay.includes(search)) return false;
    }
    return true;
  });

  // Urgent orders float to the top of whatever list is showing (stable sort keeps date order within each group).
  filtered.sort((a, b) => {
    const aUrgent = (a.priority === 'Urgent' && !a.cancelled_at) ? 1 : 0;
    const bUrgent = (b.priority === 'Urgent' && !b.cancelled_at) ? 1 : 0;
    return bUrgent - aUrgent;
  });

  emptyEl.textContent = 'Nothing here.';
  emptyEl.style.display = filtered.length === 0 ? 'block' : 'none';
  listEl.innerHTML = '';

  filtered.forEach(o => {
    const card = document.createElement('div');

    const stageIdx = STAGES.indexOf(o.status);
    const stageStart = o.status === 'Picked' ? o.picked_at : o.created_at;
    const hoursInStage = stageStart ? (Date.now() - new Date(stageStart).getTime()) / 3600000 : 0;
    const isCancelled = !!o.cancelled_at;
    const isUrgent = o.priority === 'Urgent' && !isCancelled;
    const isStale = !isCancelled && o.status !== 'Sent' && hoursInStage > 24;
    card.className = 'card' + (isStale ? ' stale' : '') + (isCancelled ? ' cancelled' : '');

    const date = new Date(o.created_at).toLocaleString('en-GB', { day:'2-digit', month:'short', year:'numeric', hour:'2-digit', minute:'2-digit' });
    const items = itemsByOrder[o.id] || [];

    const timelineHtml = STAGES.map((stage, i) => {
      const done = i < stageIdx;
      const current = i === stageIdx;
      return `
        <div class="tl-step">
          <div class="tl-line ${done ? 'done' : ''}"></div>
          <div class="tl-dot ${done ? 'done' : ''} ${current ? 'current' : ''}">${done ? '✓' : i + 1}</div>
          <div class="tl-label ${done || current ? 'active' : ''}">${stage}</div>
        </div>
      `;
    }).join('');

    const itemsHtml = items.length ? `
      <div class="items">
        <table>
          <tr><th>Part</th><th>Description</th><th style="text-align:right;">Qty</th></tr>
          ${items.map(it => `<tr><td class="pn">${escapeHtml(it.part_number || '—')}</td><td>${escapeHtml(it.description || '')}</td><td class="qty">${it.quantity}</td></tr>`).join('')}
        </table>
      </div>
    ` : '<div class="items"><em style="color:var(--gray-text); font-size:13px;">No line items recorded.</em></div>';

    const photoHtml = o.photo_url ? `<div class="photo-line"><img src="${escapeAttr(o.photo_url)}" alt="Order photo" onclick="window.open('${escapeAttr(o.photo_url)}', '_blank')"></div>` : '';

    const nextStage = STAGES[stageIdx + 1];
    const stageAgo = timeAgo(stageStart);
    const showCheckbox = nextStage && !isCancelled;
    const canEdit = !isCancelled && o.status === 'Ordered';
    const canCancel = !isCancelled && o.status !== 'Sent';

    const actionButtons = [];
    if (canEdit) actionButtons.push(`<a class="btn-edit" href="controller-order-form.html?edit=${o.id}">Edit</a>`);
    if (nextStage && !isCancelled) actionButtons.push(`<button type="button" class="advance">Mark ${nextStage}</button>`);
    if (canCancel) actionButtons.push(`<button type="button" class="btn-cancel" data-id="${o.id}">Cancel</button>`);
    const actionBarHtml = actionButtons.length ? `<div class="action-bar">${actionButtons.join('')}</div>` : '';

    const cancelNoteHtml = isCancelled
      ? `<div class="notes-line">Cancelled${o.cancel_reason ? ': ' + escapeHtml(o.cancel_reason) : ''}</div>`
      : '';

    card.innerHTML = `
      <div class="card-head">
        ${showCheckbox ? `<input type="checkbox" class="bulk-check" data-id="${o.id}" data-next="${nextStage}">` : '<div class="checkbox-spacer"></div>'}
        <div class="info">
          <h3>${escapeHtml(o.truck_serial || 'Unknown truck')}${isUrgent ? '<span class="badge-urgent">URGENT</span>' : ''}${isCancelled ? '<span class="badge-cancelled">CANCELLED</span>' : ''}</h3>
          <div class="meta">
            Ordered by ${escapeHtml(o.controller_name || '—')} for ${escapeHtml(o.engineer_name || '—')}<br>
            ${date}${stageAgo && o.status !== 'Sent' && !isCancelled ? `<br><span class="${isStale ? 'stale-badge' : ''}">${escapeHtml(o.status)} ${stageAgo}</span>` : ''}
          </div>
        </div>
      </div>
      <div class="timeline">${timelineHtml}</div>
      ${itemsHtml}
      ${photoHtml}
      ${o.notes ? `<div class="notes-line">${escapeHtml(o.notes)}</div>` : ''}
      ${cancelNoteHtml}
      ${actionBarHtml}
    `;

    if (nextStage && !isCancelled) {
      const btn = card.querySelector('button.advance');
      btn.addEventListener('click', () => advanceStatus(o.id, nextStage, btn));
    }
    const cancelBtn = card.querySelector('.btn-cancel');
    if (cancelBtn) cancelBtn.addEventListener('click', () => cancelOrder(o.id));

    const checkbox = card.querySelector('.bulk-check');
    if (checkbox) {
      checkbox.checked = selectedIds.has(o.id);
      checkbox.addEventListener('change', () => {
        if (checkbox.checked) selectedIds.add(o.id); else selectedIds.delete(o.id);
        updateBulkBar();
      });
    }

    listEl.appendChild(card);
  });

  updateBulkBar();
}

async function advanceStatus(id, nextStage, btn) {
  // "Sent" is the final stage — confirm so a stray tap can't skip an order past Picked.
  if (nextStage === 'Sent' && !confirm('Mark this order as Sent? This is the final status.')) {
    return;
  }

  btn.disabled = true;
  btn.textContent = 'Saving...';

  const update = { status: nextStage };
  if (nextStage === 'Picked') update.picked_at = new Date().toISOString();
  if (nextStage === 'Sent') update.sent_at = new Date().toISOString();

  const { error } = await sb.from('controller_orders').update(update).eq('id', id);

  if (error) {
    console.error(error);
    alert('Something went wrong saving — try again.');
    btn.disabled = false;
    btn.textContent = 'Mark ' + nextStage;
    return;
  }

  await loadOrders();
}

async function cancelOrder(id) {
  const reason = prompt('Reason for cancelling this order (optional):');
  if (reason === null) return; // they hit Cancel on the browser prompt itself

  const { error } = await sb
    .from('controller_orders')
    .update({ cancelled_at: new Date().toISOString(), cancel_reason: reason || null })
    .eq('id', id);

  if (error) {
    console.error(error);
    alert('Something went wrong — try again.');
    return;
  }

  selectedIds.delete(id);
  await loadOrders();
}

// ---- Bulk actions ----
function updateBulkBar() {
  const bar = document.getElementById('bulkBar');
  const countEl = document.getElementById('bulkCount');
  const actionBtn = document.getElementById('bulkActionBtn');

  if (selectedIds.size === 0) {
    bar.style.display = 'none';
    return;
  }
  bar.style.display = 'flex';
  countEl.textContent = `${selectedIds.size} selected`;

  // Only allow one bulk action when every selected order shares the same next stage.
  const nextStages = new Set();
  document.querySelectorAll('.bulk-check').forEach(cb => {
    if (selectedIds.has(parseInt(cb.dataset.id, 10))) nextStages.add(cb.dataset.next);
  });

  if (nextStages.size === 1) {
    const stage = [...nextStages][0];
    actionBtn.disabled = false;
    actionBtn.textContent = `Mark ${stage}`;
    actionBtn.dataset.stage = stage;
  } else {
    actionBtn.disabled = true;
    actionBtn.textContent = 'Select orders in the same stage';
    actionBtn.dataset.stage = '';
  }
}

document.getElementById('bulkClearBtn').addEventListener('click', () => {
  selectedIds.clear();
  render();
});

document.getElementById('bulkActionBtn').addEventListener('click', async () => {
  const btn = document.getElementById('bulkActionBtn');
  const stage = btn.dataset.stage;
  if (!stage) return;

  if (stage === 'Sent' && !confirm(`Mark ${selectedIds.size} order(s) as Sent? This is the final status.`)) {
    return;
  }

  btn.disabled = true;
  btn.textContent = 'Saving...';

  const update = { status: stage };
  if (stage === 'Picked') update.picked_at = new Date().toISOString();
  if (stage === 'Sent') update.sent_at = new Date().toISOString();

  const { error } = await sb.from('controller_orders').update(update).in('id', [...selectedIds]);

  if (error) {
    console.error(error);
    alert('Something went wrong saving — try again.');
    btn.disabled = false;
    return;
  }

  selectedIds.clear();
  await loadOrders();
});

document.querySelectorAll('.tab').forEach(tab => {
  tab.addEventListener('click', () => {
    document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
    tab.classList.add('active');
    currentFilter = tab.dataset.filter;
    render();
  });
});

document.getElementById('filterInput').addEventListener('input', (e) => {
  currentSearch = e.target.value.trim();
  render();
});

document.getElementById('refreshBtn').addEventListener('click', async () => {
  const btn = document.getElementById('refreshBtn');
  btn.disabled = true;
  await loadOrders();
  btn.disabled = false;
});

function escapeHtml(str) {
  if (str === null || str === undefined) return '';
  return String(str).replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
}
function escapeAttr(str) { return escapeHtml(str); }
</script>
