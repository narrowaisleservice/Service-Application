<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<script>window.ALLOWED_ROLES = ['internal', 'dealer'];</script>
<script type="module" src="auth-guard.js"></script>
<meta name="theme-color" content="#df0a1e">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icons/favicon.ico" sizes="any">
<link rel="icon" href="icons/favicon-32.png" type="image/png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;600;700&family=DM+Sans:wght@400;500;700&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<title>Truck Spec Sheets — Narrow Aisle Service Portal</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  html, body {
    width: 100%;
    background: #ffffff !important;
  }

  body {
    font-family: 'DM Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    color: #101010;
    min-height: 100vh;
  }

  header {
    background: #0a0a0a;
    border-bottom: 3px solid #df0a1e;
    padding: 20px 32px;
    display: flex;
    align-items: center;
    gap: 16px;
  }

  header img { height: 32px; }

  header h1 {
    font-family: 'IBM Plex Sans', sans-serif;
    font-size: 18px;
    font-weight: 700;
    color: #fff;
  }

  header a.back {
    margin-left: auto;
    color: #c0c0c0;
    font-size: 13px;
    text-decoration: none;
    font-family: 'DM Sans', sans-serif;
    transition: color 0.2s ease;
  }
  header a.back:hover { color: #df0a1e; }

  main {
    max-width: 1000px;
    margin: 0 auto;
    padding: 32px 24px 80px;
  }

  .search-panel {
    background: #ffffff;
    border: 1px solid #e8e8e8;
    border-radius: 16px;
    padding: 26px;
    margin-bottom: 24px;
  }

  .search-panel label {
    display: block;
    font-family: 'IBM Plex Sans', sans-serif;
    font-size: 11px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.7px;
    color: #707070;
    margin-bottom: 10px;
  }

  #searchInput {
    width: 100%;
    padding: 14px 16px;
    font-family: 'DM Mono', monospace;
    font-size: 16px;
    border: 1px solid #ddd;
    border-radius: 8px;
    outline: none;
    color: #101010;
    transition: border-color 0.2s ease;
  }
  #searchInput:focus { border-color: #df0a1e; }

  .hint {
    font-size: 12.5px;
    color: #909090;
    margin-top: 10px;
  }

  #resultsMeta {
    font-family: 'DM Mono', monospace;
    font-size: 11px;
    font-weight: 500;
    color: #df0a1e;
    text-transform: uppercase;
    letter-spacing: 1px;
    margin-bottom: 12px;
    min-height: 16px;
  }

  .result-list { display: flex; flex-direction: column; gap: 8px; }

  .result-row {
    background: #ffffff;
    border: 1px solid #e8e8e8;
    border-radius: 10px;
    padding: 16px 18px;
    display: flex;
    align-items: center;
    gap: 16px;
    cursor: pointer;
    transition: all 0.2s ease;
  }
  .result-row:hover { border-color: #df0a1e; transform: translateY(-1px); box-shadow: 0 8px 16px rgba(16,16,16,0.06); }
  .result-row.active { border-color: #df0a1e; background: rgba(223, 10, 30, 0.03); }

  .result-serial {
    font-family: 'DM Mono', monospace;
    font-weight: 500;
    font-size: 15px;
    min-width: 110px;
  }

  .result-meta {
    font-size: 12.5px;
    color: #909090;
    flex: 1;
  }

  .result-arrow { color: #df0a1e; font-size: 15px; }

  .empty-state, .loading-state {
    text-align: center;
    padding: 56px 20px;
    color: #909090;
    font-size: 14px;
  }
  .empty-state strong {
    display: block;
    color: #101010;
    font-size: 17px;
    margin-bottom: 8px;
    font-family: 'IBM Plex Sans', sans-serif;
    font-weight: 700;
  }

  .viewer-panel {
    background: #ffffff;
    border: 1px solid #e8e8e8;
    border-radius: 16px;
    margin-top: 24px;
    overflow: hidden;
  }

  .viewer-header {
    display: flex;
    align-items: center;
    gap: 14px;
    padding: 16px 20px;
    border-bottom: 1px solid #e8e8e8;
  }

  .viewer-header .serial {
    font-family: 'DM Mono', monospace;
    font-weight: 700;
    font-size: 15px;
  }

  .viewer-header .pages {
    font-size: 12.5px;
    color: #909090;
  }

  .viewer-header a.open-tab {
    margin-left: auto;
    font-size: 13px;
    color: #df0a1e;
    text-decoration: none;
    font-weight: 600;
  }
  .viewer-header a.open-tab:hover { text-decoration: underline; }

  iframe.pdf-frame {
    width: 100%;
    height: 75vh;
    border: none;
    display: block;
  }

  @media (max-width: 640px) {
    header { padding: 16px 20px; }
    header h1 { font-size: 15px; }
    main { padding: 24px 16px 60px; }
  }
</style>
</head>
<body>

<header>
  <img src="flexi-logo-white.svg?v=2" alt="Flexi">
  <h1>Truck Spec Sheets</h1>
  <a class="back" href="portal-hub-professional.html">← Back to portal</a>
</header>

<main>
  <div class="search-panel">
    <label for="searchInput">Search by truck serial number</label>
    <input type="text" id="searchInput" placeholder="e.g. 211025" autocomplete="off" inputmode="numeric">
    <div class="hint">Matches serials starting with what you type. Not every truck has a digitised spec sheet yet — this is an ongoing rollout.</div>
  </div>

  <div id="resultsMeta"></div>
  <div id="resultList" class="result-list"></div>

  <div id="viewerPanel"></div>
</main>

<script>
  const SUPABASE_URL = "https://dontubctlexlvifwhmbj.supabase.co";
  const SUPABASE_KEY = "sb_publishable_99HLzSv4wMwFZHlR81yIsQ_z0A0Jpth";
  const db = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

  const searchInput = document.getElementById('searchInput');
  const resultsMeta = document.getElementById('resultsMeta');
  const resultList = document.getElementById('resultList');
  const viewerPanel = document.getElementById('viewerPanel');

  let debounceTimer = null;

  function formatSize(bytes) {
    if (!bytes) return '';
    const mb = bytes / (1024 * 1024);
    return mb >= 1 ? `${mb.toFixed(1)} MB` : `${(bytes / 1024).toFixed(0)} KB`;
  }

  function formatDate(iso) {
    if (!iso) return '';
    return new Date(iso).toLocaleDateString('en-GB', { day: 'numeric', month: 'short', year: 'numeric' });
  }

  function addToRecentlyViewed(serial) {
    let list = [];
    try { list = JSON.parse(localStorage.getItem('na_recently_viewed') || '[]'); } catch (e) {}
    const url = `truck-specs.html?serial=${encodeURIComponent(serial)}`;
    list = list.filter(item => item.url !== url);
    list.unshift({ type: 'truck', label: `Spec: ${serial}`, url, ts: Date.now() });
    list = list.slice(0, 8);
    localStorage.setItem('na_recently_viewed', JSON.stringify(list));
  }

  async function runSearch(term, autoOpenExact) {
    if (!term) {
      resultList.innerHTML = '';
      resultsMeta.textContent = '';
      return;
    }

    resultsMeta.textContent = 'Searching…';
    resultList.innerHTML = '';

    const { data, error } = await db
      .from('truck_specs')
      .select('serial_no, file_name, storage_path, page_count, file_size_bytes, uploaded_at')
      .ilike('serial_no', `${term}%`)
      .order('serial_no', { ascending: true })
      .limit(50);

    if (error) {
      resultsMeta.textContent = '';
      resultList.innerHTML = `<div class="empty-state"><strong>Search failed</strong>Try again in a moment.</div>`;
      console.error(error);
      return;
    }

    if (!data || data.length === 0) {
      resultsMeta.textContent = '';
      resultList.innerHTML = `
        <div class="empty-state">
          <strong>No spec sheet found for "${term}"</strong>
          This truck may not be digitised yet, or double-check the serial number.
        </div>`;
      return;
    }

    resultsMeta.textContent = `${data.length} match${data.length === 1 ? '' : 'es'}`;
    resultList.innerHTML = data.map(row => `
      <div class="result-row" data-serial="${row.serial_no}" data-path="${row.storage_path}" data-pages="${row.page_count || ''}">
        <div class="result-serial">${row.serial_no}</div>
        <div class="result-meta">${row.page_count || '?'} pages · ${formatSize(row.file_size_bytes)} · uploaded ${formatDate(row.uploaded_at)}</div>
        <div class="result-arrow">→</div>
      </div>
    `).join('');

    resultList.querySelectorAll('.result-row').forEach(el => {
      el.addEventListener('click', () => openViewer(el.dataset.serial, el.dataset.path, el.dataset.pages));
    });

    if (autoOpenExact) {
      const exact = data.find(row => row.serial_no === term);
      if (exact) openViewer(exact.serial_no, exact.storage_path, exact.page_count);
    }
  }

  async function openViewer(serial, storagePath, pages) {
    document.querySelectorAll('.result-row').forEach(el => {
      el.classList.toggle('active', el.dataset.serial === serial);
    });

    viewerPanel.innerHTML = `<div class="loading-state">Loading spec sheet…</div>`;

    const { data, error } = await db.storage
      .from('truck-specs')
      .createSignedUrl(storagePath, 300); // 5 min, plenty for viewing

    if (error || !data) {
      viewerPanel.innerHTML = `<div class="empty-state"><strong>Couldn't load this file</strong>Try again, or check the file still exists in storage.</div>`;
      console.error(error);
      return;
    }

    addToRecentlyViewed(serial);

    viewerPanel.innerHTML = `
      <div class="viewer-panel">
        <div class="viewer-header">
          <span class="serial">${serial}</span>
          <span class="pages">${pages ? pages + ' pages' : ''}</span>
          <a class="open-tab" href="${data.signedUrl}" target="_blank" rel="noopener">Open in new tab ↗</a>
        </div>
        <iframe class="pdf-frame" src="${data.signedUrl}"></iframe>
      </div>
    `;
  }

  searchInput.addEventListener('input', (e) => {
    clearTimeout(debounceTimer);
    const term = e.target.value.trim();
    debounceTimer = setTimeout(() => runSearch(term, false), 250);
  });

  // Deep-link support: truck-specs.html?serial=211025
  const params = new URLSearchParams(window.location.search);
  const initialSerial = params.get('serial');
  if (initialSerial) {
    searchInput.value = initialSerial;
    runSearch(initialSerial, true);
  } else {
    searchInput.focus();
  }
</script>

</body>
</html>
