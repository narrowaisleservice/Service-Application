<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Asset Tracking | Narrow Aisle Service Portal</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --red:#df0a1e;
    --black:#0a0a0a;
    --sidebar:#111214;
    --grey-100:#f6f6f7;
    --grey-200:#ececee;
    --grey-300:#dcdde0;
    --grey-500:#8a8d93;
    --grey-700:#4a4d52;
    --green:#1a8a4c;
    --amber:#c07a06;
    --white:#ffffff;
    --radius:10px;
  }
  *{box-sizing:border-box;}
  body{
    margin:0; background:var(--white); color:var(--black);
    font-family:'IBM Plex Sans',sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  .mono{font-family:'DM Mono',monospace;}

  .topbar{
    background:var(--sidebar); color:var(--white);
    padding:16px 24px; display:flex; align-items:center; justify-content:space-between;
    position:sticky; top:0; z-index:20;
  }
  .topbar .brand{display:flex; align-items:center; gap:12px;}
  .topbar .brand .bar{width:6px; height:22px; background:var(--red); border-radius:2px;}
  .topbar h1{font-size:17px; font-weight:600; margin:0; letter-spacing:.2px;}
  .topbar a.back{color:var(--grey-300); text-decoration:none; font-size:13px; font-weight:500;}
  .topbar a.back:hover{color:var(--white);}

  .wrap{max-width:1180px; margin:0 auto; padding:24px;}

  .stats{display:grid; grid-template-columns:repeat(5,1fr); gap:12px; margin-bottom:22px;}
  .stat{
    border:1px solid var(--grey-200); border-radius:var(--radius); padding:14px 16px;
    background:var(--white);
  }
  .stat .n{font-family:'DM Mono',monospace; font-size:26px; font-weight:500; line-height:1;}
  .stat .l{font-size:12px; color:var(--grey-700); margin-top:6px; font-weight:500;}
  .stat.overdue .n{color:var(--red);}
  .stat.duesoon .n{color:var(--amber);}
  .stat.ok .n{color:var(--green);}
  .stat.oos .n, .stat.notpres .n{color:var(--grey-500);}

  .tabs{display:flex; gap:4px; border-bottom:2px solid var(--grey-200); margin-bottom:18px;}
  .tab{
    padding:10px 18px; font-size:14px; font-weight:600; color:var(--grey-700);
    cursor:pointer; border-bottom:2px solid transparent; margin-bottom:-2px;
    background:none; border-top:none; border-left:none; border-right:none;
  }
  .tab.active{color:var(--red); border-bottom-color:var(--red);}
  .tab .count{color:var(--grey-500); font-weight:500; margin-left:4px;}
  .tab.active .count{color:var(--red);}

  .toolbar{display:flex; gap:10px; align-items:center; margin-bottom:16px; flex-wrap:wrap;}
  .toolbar input[type=text], .toolbar select{
    border:1px solid var(--grey-300); border-radius:8px; padding:9px 12px; font-size:13px;
    font-family:inherit; background:var(--white);
  }
  .toolbar input[type=text]{flex:1; min-width:180px;}
  .btn{
    border:none; border-radius:8px; padding:9px 16px; font-size:13px; font-weight:600;
    cursor:pointer; font-family:inherit;
  }
  .btn-primary{background:var(--red); color:var(--white);}
  .btn-primary:hover{background:#b80916;}
  .btn-ghost{background:var(--grey-100); color:var(--black); border:1px solid var(--grey-300);}
  .btn-ghost:hover{background:var(--grey-200);}
  .btn-small{padding:5px 10px; font-size:12px; border-radius:6px;}

  table{width:100%; border-collapse:collapse; font-size:13px;}
  thead th{
    text-align:left; font-size:11px; text-transform:uppercase; letter-spacing:.4px;
    color:var(--grey-700); padding:8px 10px; border-bottom:1px solid var(--grey-300);
  }
  tbody td{padding:10px; border-bottom:1px solid var(--grey-200); vertical-align:top;}
  tbody tr:hover{background:var(--grey-100);}
  .desc{font-weight:600;}
  .sub{color:var(--grey-500); font-size:12px; margin-top:2px;}

  .badge{
    display:inline-block; padding:3px 9px; border-radius:20px; font-size:11px; font-weight:600;
    white-space:nowrap;
  }
  .badge.Overdue{background:#fbe3e5; color:var(--red);}
  .badge.DueSoon{background:#fbeecd; color:var(--amber);}
  .badge.OK{background:#dff2e6; color:var(--green);}
  .badge.OutOfService{background:var(--grey-200); color:var(--grey-700);}
  .badge.NotPresented{background:#efe3f6; color:#6b3fa0;}

  .row-actions{display:flex; gap:6px; flex-wrap:wrap;}

  .empty{text-align:center; padding:60px 20px; color:var(--grey-500);}

  .modal-overlay{
    display:none; position:fixed; inset:0; background:rgba(10,10,10,.5);
    align-items:center; justify-content:center; z-index:50; padding:20px;
  }
  .modal-overlay.open{display:flex;}
  .modal{
    background:var(--white); border-radius:14px; width:100%; max-width:560px;
    max-height:88vh; overflow-y:auto; padding:26px;
  }
  .modal h2{margin:0 0 18px; font-size:17px;}
  .field{margin-bottom:14px;}
  .field label{display:block; font-size:12px; font-weight:600; color:var(--grey-700); margin-bottom:5px;}
  .field input, .field select, .field textarea{
    width:100%; border:1px solid var(--grey-300); border-radius:8px; padding:9px 11px;
    font-size:13px; font-family:inherit;
  }
  .field-row{display:grid; grid-template-columns:1fr 1fr; gap:12px;}
  .modal-actions{display:flex; justify-content:flex-end; gap:10px; margin-top:18px;}

  .toast{
    position:fixed; bottom:24px; left:50%; transform:translateX(-50%);
    background:var(--black); color:var(--white); padding:11px 20px; border-radius:8px;
    font-size:13px; z-index:60; display:none;
  }
  .toast.show{display:block;}

  @media (max-width: 800px){
    .stats{grid-template-columns:repeat(2,1fr);}
    .field-row{grid-template-columns:1fr;}
    table, thead, tbody, tr, th, td{display:block;}
    thead{display:none;}
    tbody tr{border:1px solid var(--grey-200); border-radius:10px; margin-bottom:10px; padding:8px;}
    tbody td{border-bottom:none; padding:6px 4px;}
    tbody td:before{content:attr(data-label); font-size:10px; color:var(--grey-500); display:block; text-transform:uppercase;}
  }
</style>
</head>
<body>

<div class="topbar">
  <div class="brand"><div class="bar"></div><h1>Asset Tracking</h1></div>
  <a class="back" href="portal-hub-professional.html">&larr; Back to portal</a>
</div>

<div class="wrap">

  <div class="stats" id="stats"></div>

  <div class="tabs" id="tabs">
    <button class="tab active" data-type="Calibration">Calibration <span class="count" id="count-Calibration">0</span></button>
    <button class="tab" data-type="Jack">Jacks <span class="count" id="count-Jack">0</span></button>
    <button class="tab" data-type="PAT">PAT Testing <span class="count" id="count-PAT">0</span></button>
  </div>

  <div class="toolbar">
    <input type="text" id="search" placeholder="Search description, owner, ref, comments...">
    <select id="statusFilter">
      <option value="">All statuses</option>
      <option value="Overdue">Overdue</option>
      <option value="DueSoon">Due within 30 days</option>
      <option value="OK">OK</option>
      <option value="OutOfService">Out of service</option>
      <option value="NotPresented">Not presented</option>
    </select>
    <button class="btn btn-ghost btn-small" id="refreshBtn">Refresh</button>
    <button class="btn btn-primary" id="addBtn">+ Add asset</button>
  </div>

  <div id="tableHolder"></div>

</div>

<div class="modal-overlay" id="modalOverlay">
  <div class="modal">
    <h2 id="modalTitle">Add asset</h2>
    <form id="assetForm">
      <input type="hidden" id="f_id">
      <div class="field">
        <label>Type</label>
        <select id="f_type">
          <option value="Calibration">Calibration</option>
          <option value="Jack">Jack</option>
          <option value="PAT">PAT</option>
        </select>
      </div>
      <div class="field-row">
        <div class="field"><label>Ref</label><input type="text" id="f_ref" required></div>
        <div class="field"><label>Dept</label><input type="text" id="f_dept"></div>
      </div>
      <div class="field"><label>Description</label><input type="text" id="f_desc" required></div>
      <div class="field"><label>Owner</label><input type="text" id="f_owner"></div>
      <div class="field-row">
        <div class="field"><label>Interval (years)</label><input type="number" step="0.5" id="f_duration"></div>
        <div class="field"><label>Done by</label><input type="text" id="f_doneby"></div>
      </div>
      <div class="field-row">
        <div class="field"><label>Last done</label><input type="date" id="f_lastdate"></div>
        <div class="field"><label>Next due</label><input type="date" id="f_nextdue"></div>
      </div>
      <div class="field"><label>Status</label>
        <select id="f_state">
          <option value="Active">Active</option>
          <option value="OutOfService">Out of service</option>
          <option value="NotPresented">Not presented</option>
        </select>
      </div>
      <div class="field"><label>Comments</label><textarea id="f_comments" rows="2"></textarea></div>
      <div class="modal-actions">
        <button type="button" class="btn btn-ghost" id="cancelBtn">Cancel</button>
        <button type="submit" class="btn btn-primary" id="saveBtn">Save</button>
      </div>
    </form>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
// ==== CONFIG ====
const API_URL = 'PASTE_YOUR_GAS_WEB_APP_URL_HERE';
// ================

let allAssets = [];
let currentType = 'Calibration';

function toast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'), 2200);
}

async function loadAssets(){
  document.getElementById('tableHolder').innerHTML = '<div class="empty">Loading…</div>';
  try{
    const res = await fetch(API_URL);
    const json = await res.json();
    if(!json.success) throw new Error(json.error || 'Load failed');
    allAssets = json.data;
    renderAll();
  }catch(err){
    document.getElementById('tableHolder').innerHTML =
      '<div class="empty">Could not load data. Check API_URL is set to your deployed GAS web app URL.<br><span class="mono">' + err.message + '</span></div>';
  }
}

function renderAll(){
  renderStats();
  renderCounts();
  renderTable();
}

function renderCounts(){
  ['Calibration','Jack','PAT'].forEach(t=>{
    document.getElementById('count-'+t).textContent = allAssets.filter(a=>a.Type===t).length;
  });
}

function renderStats(){
  const list = allAssets.filter(a=>a.Type===currentType);
  const c = { Overdue:0, DueSoon:0, OK:0, OutOfService:0, NotPresented:0 };
  list.forEach(a=>{ if(c[a.urgency] !== undefined) c[a.urgency]++; });
  document.getElementById('stats').innerHTML = `
    <div class="stat overdue"><div class="n">${c.Overdue}</div><div class="l">Overdue</div></div>
    <div class="stat duesoon"><div class="n">${c.DueSoon}</div><div class="l">Due within 30 days</div></div>
    <div class="stat ok"><div class="n">${c.OK}</div><div class="l">OK</div></div>
    <div class="stat oos"><div class="n">${c.OutOfService}</div><div class="l">Out of service</div></div>
    <div class="stat notpres"><div class="n">${c.NotPresented}</div><div class="l">Not presented</div></div>
  `;
}

function badgeLabel(u){
  return {Overdue:'Overdue', DueSoon:'Due soon', OK:'OK', OutOfService:'Out of service', NotPresented:'Not presented'}[u] || u;
}

function renderTable(){
  const search = document.getElementById('search').value.trim().toLowerCase();
  const statusFilter = document.getElementById('statusFilter').value;

  let list = allAssets.filter(a=>a.Type===currentType);
  if(statusFilter) list = list.filter(a=>a.urgency===statusFilter);
  if(search){
    list = list.filter(a =>
      (a.Description||'').toLowerCase().includes(search) ||
      (a.Owner||'').toLowerCase().includes(search) ||
      (String(a.Ref)||'').toLowerCase().includes(search) ||
      (a.Comments||'').toLowerCase().includes(search) ||
      (a.Dept||'').toLowerCase().includes(search)
    );
  }
  list.sort((a,b) => (a.daysRemaining ?? 9999) - (b.daysRemaining ?? 9999));

  if(list.length === 0){
    document.getElementById('tableHolder').innerHTML = '<div class="empty">No assets match.</div>';
    return;
  }

  let rows = list.map(a => `
    <tr>
      <td data-label="Ref" class="mono">${a.Ref}</td>
      <td data-label="Description">
        <div class="desc">${a.Description}</div>
        <div class="sub">${a.Dept || ''}${a.Comments ? ' — ' + a.Comments : ''}</div>
      </td>
      <td data-label="Owner">${a.Owner || ''}</td>
      <td data-label="Last done" class="mono">${a.LastDate || '—'}</td>
      <td data-label="Next due" class="mono">${a.NextDue || '—'}</td>
      <td data-label="Days" class="mono">${a.daysRemaining !== null ? a.daysRemaining : '—'}</td>
      <td data-label="Status"><span class="badge ${a.urgency}">${badgeLabel(a.urgency)}</span></td>
      <td data-label="Actions">
        <div class="row-actions">
          <button class="btn btn-ghost btn-small" onclick="markDone('${a.ID}')">Mark done</button>
          <button class="btn btn-ghost btn-small" onclick="openEdit('${a.ID}')">Edit</button>
        </div>
      </td>
    </tr>
  `).join('');

  document.getElementById('tableHolder').innerHTML = `
    <table>
      <thead><tr>
        <th>Ref</th><th>Description</th><th>Owner</th><th>Last done</th><th>Next due</th><th>Days</th><th>Status</th><th>Actions</th>
      </tr></thead>
      <tbody>${rows}</tbody>
    </table>
  `;
}

async function markDone(id){
  const doneBy = prompt('Done by (name):', '');
  if(doneBy === null) return;
  try{
    const res = await fetch(API_URL, { method:'POST', headers:{'Content-Type':'text/plain;charset=utf-8'},
      body: JSON.stringify({ action:'markDone', id, doneBy }) });
    const json = await res.json();
    if(!json.success) throw new Error(json.error);
    toast('Marked done — next due ' + json.nextDue);
    loadAssets();
  }catch(err){ toast('Error: ' + err.message); }
}

function openAdd(){
  document.getElementById('modalTitle').textContent = 'Add asset';
  document.getElementById('assetForm').reset();
  document.getElementById('f_id').value = '';
  document.getElementById('f_type').value = currentType;
  document.getElementById('modalOverlay').classList.add('open');
}

function openEdit(id){
  const a = allAssets.find(x=>x.ID===id);
  if(!a) return;
  document.getElementById('modalTitle').textContent = 'Edit ' + a.ID;
  document.getElementById('f_id').value = a.ID;
  document.getElementById('f_type').value = a.Type;
  document.getElementById('f_ref').value = a.Ref;
  document.getElementById('f_dept').value = a.Dept || '';
  document.getElementById('f_desc').value = a.Description || '';
  document.getElementById('f_owner').value = a.Owner || '';
  document.getElementById('f_duration').value = a.DurationYears || '';
  document.getElementById('f_doneby').value = a.DoneBy || '';
  document.getElementById('f_lastdate').value = a.LastDate || '';
  document.getElementById('f_nextdue').value = a.NextDue || '';
  document.getElementById('f_state').value = a.State || 'Active';
  document.getElementById('f_comments').value = a.Comments || '';
  document.getElementById('modalOverlay').classList.add('open');
}

function closeModal(){ document.getElementById('modalOverlay').classList.remove('open'); }

document.getElementById('addBtn').onclick = openAdd;
document.getElementById('cancelBtn').onclick = closeModal;
document.getElementById('refreshBtn').onclick = loadAssets;
document.getElementById('search').oninput = renderTable;
document.getElementById('statusFilter').onchange = renderTable;

document.querySelectorAll('.tab').forEach(tab=>{
  tab.onclick = () => {
    document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));
    tab.classList.add('active');
    currentType = tab.dataset.type;
    renderAll();
  };
});

document.getElementById('assetForm').onsubmit = async (e) => {
  e.preventDefault();
  const id = document.getElementById('f_id').value;
  const fields = {
    Type: document.getElementById('f_type').value,
    Ref: document.getElementById('f_ref').value,
    Dept: document.getElementById('f_dept').value,
    Description: document.getElementById('f_desc').value,
    Owner: document.getElementById('f_owner').value,
    DurationYears: document.getElementById('f_duration').value,
    DoneBy: document.getElementById('f_doneby').value,
    LastDate: document.getElementById('f_lastdate').value,
    NextDue: document.getElementById('f_nextdue').value,
    State: document.getElementById('f_state').value,
    Comments: document.getElementById('f_comments').value,
  };
  try{
    let body;
    if(id){
      body = { action:'update', id, fields };
    }else{
      body = { action:'add', record: fields };
    }
    const res = await fetch(API_URL, { method:'POST', headers:{'Content-Type':'text/plain;charset=utf-8'}, body: JSON.stringify(body) });
    const json = await res.json();
    if(!json.success) throw new Error(json.error);
    toast(id ? 'Saved' : 'Added');
    closeModal();
    loadAssets();
  }catch(err){ toast('Error: ' + err.message); }
};

loadAssets();
</script>
</body>
</html>
