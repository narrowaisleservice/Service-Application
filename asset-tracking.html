<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#df0a1e">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;600;700&family=DM+Sans:wght@400;500;700&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<title>Asset Tracking - Narrow Aisle Service Portal</title>
<style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { background: white !important; color-scheme: light only; }
    body {
        font-family: 'DM Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        color: #101010;
        min-height: 100vh;
        visibility: hidden;
    }
    .header {
        background: linear-gradient(135deg, #ffffff 0%, #fafafa 100%);
        border-bottom: 3px solid #df0a1e;
        padding: 24px 32px;
        position: sticky;
        top: 0;
        z-index: 50;
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 16px;
        flex-wrap: wrap;
    }
    .header-left {
        display: flex;
        align-items: center;
        gap: 14px;
        min-width: 0;
    }
    .back-btn {
        background: none;
        border: none;
        color: #101010;
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 4px;
        border-radius: 6px;
        flex-shrink: 0;
    }
    .back-btn:hover, .back-btn:active {
        color: #df0a1e;
        background: #f5f5f5;
    }
    .header-title { font-family: 'IBM Plex Sans', sans-serif; font-size: 28px; font-weight: 700; }
    .header-subtitle { font-size: 13px; color: #707070; margin-top: 2px; }
    .manage-btn {
        padding: 10px 18px;
        background: #df0a1e;
        border: none;
        border-radius: 8px;
        color: white;
        font-family: 'IBM Plex Sans', sans-serif;
        font-size: 12px;
        font-weight: 700;
        text-transform: uppercase;
        letter-spacing: 0.3px;
        cursor: pointer;
        text-decoration: none;
        display: inline-block;
    }
    .manage-btn:hover { background: #c3161e; }
    .user-bar {
        background: #fafafa;
        border-bottom: 1px solid #eee;
        padding: 8px 32px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        font-family: 'DM Mono', monospace;
        font-size: 12px;
        color: #707070;
    }
    .user-bar button {
        background: none; border: none; color: #df0a1e;
        font-family: 'DM Mono', monospace; font-size: 12px; cursor: pointer;
        text-decoration: underline; padding: 0;
    }
    .content { max-width: 900px; margin: 0 auto; padding: 32px; }
    .search-row { margin-bottom: 24px; }
    .search-row input {
        width: 100%;
        font-family: 'DM Sans', sans-serif;
        font-size: 15px;
        padding: 14px 16px;
        border: 1.5px solid #ddd;
        border-radius: 10px;
        color: #101010;
    }
    .search-row input:focus { outline: none; border-color: #df0a1e; }

    .type-group {
        margin-bottom: 28px;
        border: 1px solid #e8e8e8;
        border-radius: 14px;
        overflow: hidden;
    }
    .type-head {
        background: #fafafa;
        border-bottom: 1px solid #e8e8e8;
        padding: 14px 20px;
        display: flex;
        justify-content: space-between;
        align-items: center;
    }
    .type-head h2 {
        font-family: 'IBM Plex Sans', sans-serif;
        font-size: 17px;
        font-weight: 700;
    }
    .type-count {
        font-family: 'DM Mono', monospace;
        font-size: 12px;
        color: #707070;
        background: #eee;
        padding: 3px 10px;
        border-radius: 20px;
    }
    .unit-row {
        display: flex;
        align-items: center;
        gap: 14px;
        padding: 14px 20px;
        border-bottom: 1px solid #f0f0f0;
    }
    .unit-row:last-child { border-bottom: none; }
    .unit-holder {
        font-weight: 700;
        font-size: 15px;
        min-width: 160px;
    }
    .unit-region {
        font-family: 'DM Mono', monospace;
        font-size: 12px;
        color: #fff;
        background: #df0a1e;
        padding: 3px 10px;
        border-radius: 20px;
        text-transform: uppercase;
        letter-spacing: 0.3px;
    }
    .unit-region.none {
        background: #eee;
        color: #909090;
    }
    .unit-notes {
        font-size: 13px;
        color: #707070;
        flex: 1;
    }
    .empty-state, .loading-state {
        text-align: center;
        color: #909090;
        padding: 60px 20px;
        font-size: 14px;
    }
</style>
</head>
<body>

<div class="header">
    <div class="header-left">
        <button type="button" class="back-btn" id="backBtn" aria-label="Go back">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
        </button>
        <div>
            <div class="header-title">Asset Tracking</div>
            <div class="header-subtitle">Where's the equipment right now?</div>
        </div>
    </div>
    <a href="asset-tracking-edit.html" class="manage-btn">Manage Assets</a>
</div>
<div class="user-bar">
    <span id="userEmail"></span>
    <button type="button" id="logoutBtn">Log out</button>
</div>

<div class="content">
    <div class="search-row">
        <input type="text" id="searchInput" placeholder="Search by equipment, holder, or region...">
    </div>
    <div id="resultsWrap"><div class="loading-state">Loading...</div></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const SUPABASE_URL = 'https://dontubctlexlvifwhmbj.supabase.co';
const SUPABASE_KEY = 'sb_publishable_99HLzSv4wMwFZHlR81yIsQ_z0A0Jpth';
const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

let allAssets = [];

document.getElementById('backBtn').addEventListener('click', () => {
  if (document.referrer && new URL(document.referrer).host === location.host) {
    history.back();
  } else {
    window.location.href = 'portal-hub-professional.html';
  }
});

(async () => {
  const { data: { session } } = await sb.auth.getSession();
  if (!session) {
    window.location.href = 'login.html?redirect=' + encodeURIComponent(location.pathname.split('/').pop());
    return;
  }
  document.getElementById('userEmail').textContent = 'Logged in as ' + session.user.email;
  document.body.style.visibility = 'visible';
  loadAssets();
})();

sb.auth.onAuthStateChange((event, session) => {
  if (event === 'SIGNED_OUT' || !session) {
    window.location.href = 'login.html';
  }
});

document.getElementById('logoutBtn').addEventListener('click', async () => {
  await sb.auth.signOut();
  window.location.href = 'login.html';
});

async function loadAssets() {
  const { data, error } = await sb
    .from('equipment_assets')
    .select('*')
    .order('equipment_type', { ascending: true });

  if (error) {
    document.getElementById('resultsWrap').innerHTML = '<div class="empty-state">Could not reach Supabase.<br>' + (error.message || error) + '</div>';
    return;
  }
  allAssets = data || [];
  render();
}

function render() {
  const q = document.getElementById('searchInput').value.trim().toLowerCase();
  const filtered = q
    ? allAssets.filter(a =>
        (a.equipment_type || '').toLowerCase().includes(q) ||
        (a.holder || '').toLowerCase().includes(q) ||
        (a.region || '').toLowerCase().includes(q))
    : allAssets;

  const wrap = document.getElementById('resultsWrap');

  if (filtered.length === 0) {
    wrap.innerHTML = '<div class="empty-state">No matching equipment.</div>';
    return;
  }

  const groups = {};
  filtered.forEach(a => {
    const key = a.equipment_type || 'Unnamed equipment';
    if (!groups[key]) groups[key] = [];
    groups[key].push(a);
  });

  wrap.innerHTML = Object.keys(groups).sort().map(type => {
    const units = groups[type];
    const rows = units.map(u => `
      <div class="unit-row">
        <div class="unit-holder">${escapeHtml(u.holder || 'Unassigned')}</div>
        <div class="unit-region ${u.region ? '' : 'none'}">${escapeHtml(u.region || 'No region')}</div>
        ${u.notes ? `<div class="unit-notes">${escapeHtml(u.notes)}</div>` : '<div class="unit-notes"></div>'}
      </div>
    `).join('');

    return `
      <div class="type-group">
        <div class="type-head">
          <h2>${escapeHtml(type)}</h2>
          <div class="type-count">${units.length} unit${units.length === 1 ? '' : 's'}</div>
        </div>
        ${rows}
      </div>
    `;
  }).join('');
}

document.getElementById('searchInput').addEventListener('input', render);

function escapeHtml(str) {
  if (str === null || str === undefined) return '';
  return String(str).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
</script>
</body>
</html>
