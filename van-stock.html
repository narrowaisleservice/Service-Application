<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Van Stock - Narrow Aisle Portal</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: #1a1a1a;
            color: #e0e0e0;
            height: 100vh;
            display: flex;
            flex-direction: column;
        }
        .header {
            background: linear-gradient(180deg, rgba(30, 30, 30, 0.8) 0%, rgba(20, 20, 20, 0.6) 100%);
            backdrop-filter: blur(20px);
            border-bottom: 1px solid rgba(220, 38, 38, 0.15);
            padding: 16px 24px;
            display: flex;
            align-items: center;
            gap: 16px;
            z-index: 100;
        }
        .back-btn {
            background: none;
            border: none;
            color: #ffffff;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 4px;
            border-radius: 6px;
            flex-shrink: 0;
        }
        .back-btn:hover, .back-btn:active {
            color: #dc2626;
            background: rgba(255,255,255,0.08);
        }
        .header h1 {
            font-size: 20px;
            font-weight: 800;
            flex: 1;
        }
        .content {
            flex: 1;
            overflow: hidden;
        }
        iframe {
            width: 100%;
            height: 100%;
            border: none;
            display: block;
        }
    </style>
</head>
<body>
    <div class="header">
        <button type="button" class="back-btn" id="backBtn" aria-label="Go back">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
        </button>
        <h1>Van Stock</h1>
    </div>
    <div class="content">
        <iframe src="https://narrowaisleservice.github.io/Flexi-Parts-System/#van-stock" title="Van Stock"></iframe>
    </div>
    <script>
        document.getElementById('backBtn').addEventListener('click', () => {
            if (document.referrer && new URL(document.referrer).host === location.host) {
                history.back();
            } else {
                window.location.href = 'portal-hub-professional.html';
            }
        });
    </script>
</body>
</html>
