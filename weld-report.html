<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Report Weld Damage | Narrow Aisle Service</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=DM+Sans:wght@400;500;700&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --red: #df0a1e;
    --black: #111111;
    --grey-bg: #f5f5f5;
    --border: #e0e0e0;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: 'IBM Plex Sans', sans-serif;
    background: var(--grey-bg);
    color: var(--black);
  }
  header {
    background: var(--black);
    color: #fff;
    padding: 18px 20px;
    display: flex;
    align-items: center;
    gap: 10px;
  }
  header .bar { width: 6px; height: 26px; background: var(--red); border-radius: 2px; }
  header h1 { font-size: 18px; font-weight: 700; margin: 0; font-family: 'DM Sans', sans-serif; }
  header p { margin: 2px 0 0; font-size: 12px; color: #bbb; }

  main { max-width: 560px; margin: 0 auto; padding: 20px 16px 80px; }

  .card {
    background: #fff;
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 18px;
    margin-bottom: 16px;
  }

  label {
    display: block;
    font-size: 13px;
    font-weight: 600;
    margin-bottom: 6px;
    color: #333;
  }
  input[type=text], textarea, select {
    width: 100%;
    padding: 11px 12px;
    border: 1px solid var(--border);
    border-radius: 8px;
    font-size: 15px;
    font-family: 'IBM Plex Sans', sans-serif;
    margin-bottom: 16px;
    background: #fff;
  }
  textarea { min-height: 80px; resize: vertical; }
  input:focus, textarea:focus, select:focus {
    outline: none;
    border-color: var(--red);
  }

  .photo-btn {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    width: 100%;
    padding: 16px;
    border: 2px dashed var(--red);
    border-radius: 10px;
    background: #fff5f5;
    color: var(--red);
    font-weight: 600;
    font-size: 15px;
    cursor: pointer;
    margin-bottom: 14px;
  }
  input[type=file] { display: none; }

  .thumbs {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 8px;
    margin-bottom: 16px;
  }
  .thumb {
    position: relative;
    aspect-ratio: 1;
    border-radius: 8px;
    overflow: hidden;
    border: 1px solid var(--border);
  }
  .thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .thumb .remove {
    position: absolute;
    top: 4px; right: 4px;
    width: 22px; height: 22px;
    background: rgba(0,0,0,0.65);
    color: #fff;
    border: none;
    border-radius: 50%;
    font-size: 14px;
    line-height: 1;
    cursor: pointer;
  }

  button.submit {
    width: 100%;
    padding: 15px;
    background: var(--red);
    color: #fff;
    border: none;
    border-radius: 8px;
    font-size: 16px;
    font-weight: 700;
    font-family: 'DM Sans', sans-serif;
    cursor: pointer;
  }
  button.submit:disabled { background: #ccc; cursor: not-allowed; }

  .status {
    display: none;
    margin-top: 14px;
    padding: 14px;
    border-radius: 8px;
    font-size: 14px;
    font-weight: 500;
  }
  .status.show { display: block; }
  .status.ok { background: #e8f7ec; color: #1a7a34; border: 1px solid #b6e6c3; }
  .status.err { background: #fde8ea; color: var(--red); border: 1px solid #f5c2c8; }
  .status.busy { background: #fff8e6; color: #8a6d00; border: 1px solid #f2e0a0; }

  .hint { font-size: 12px; color: #888; margin-top: -8px; margin-bottom: 16px; }
</style>
</head>
<body>

<header>
  <div class="bar"></div>
  <div>
    <h1>Report Weld Damage</h1>
    <p>Photos go straight to Mike for a remote assessment</p>
  </div>
</header>

<main>
  <div class="card">
    <form id="weldForm">
      <label for="engineerName">Your name</label>
      <input type="text" id="engineerName" required autocomplete="name">

      <label for="customerName">Customer / site name</label>
      <input type="text" id="customerName" required>

      <label for="truckSerial">Truck serial number</label>
      <input type="text" id="truckSerial" required>

      <label for="truckModel">Truck model</label>
      <select id="truckModel">
        <option value="">Select if known</option>
        <option>H2B DC</option>
        <option>AC3</option>
        <option>ACe Gen1</option>
        <option>ACe Gen2</option>
        <option>Other</option>
      </select>

      <label for="description">Where is it, and what does it look like?</label>
      <textarea id="description" placeholder="e.g. Chassis leg, driver's side, hairline damage ~40mm near the weld seam" required></textarea>

      <label>Photos</label>
      <div class="hint">Take clear, well-lit photos from a couple of angles. Include something for scale if you can.</div>
      <label class="photo-btn" for="photoInput">📷 Add photo</label>
      <input type="file" id="photoInput" accept="image/*" capture="environment" multiple>
      <div class="thumbs" id="thumbs"></div>

      <button type="submit" class="submit" id="submitBtn">Send to Mike</button>
      <div class="status" id="status"></div>
    </form>
  </div>
</main>

<script>
// ===== CONFIG =====
const GAS_URL = 'https://script.google.com/macros/s/AKfycbzM1kCIWAiKbVTEEBQvLj-jaGGHv7TGR8cWVbTFMUEIAhmV-Qyqn1oZhl_O0uzC0HtCew/exec';
const MAX_DIMENSION = 1600;
const JPEG_QUALITY = 0.7;

let photos = []; // { base64, mimeType }

document.getElementById('photoInput').addEventListener('change', function(e) {
  const files = Array.from(e.target.files);
  files.forEach(function(file) {
    resizeAndEncode(file).then(function(result) {
      photos.push(result);
      renderThumbs();
    });
  });
  e.target.value = '';
});

function resizeAndEncode(file) {
  return new Promise(function(resolve) {
    const img = new Image();
    const reader = new FileReader();
    reader.onload = function(e) {
      img.onload = function() {
        let w = img.width, h = img.height;
        if (w > h && w > MAX_DIMENSION) { h = h * (MAX_DIMENSION / w); w = MAX_DIMENSION; }
        else if (h > MAX_DIMENSION) { w = w * (MAX_DIMENSION / h); h = MAX_DIMENSION; }
        const canvas = document.createElement('canvas');
        canvas.width = w; canvas.height = h;
        canvas.getContext('2d').drawImage(img, 0, 0, w, h);
        const dataUrl = canvas.toDataURL('image/jpeg', JPEG_QUALITY);
        resolve({
          base64: dataUrl.split(',')[1],
          mimeType: 'image/jpeg',
          previewUrl: dataUrl
        });
      };
      img.src = e.target.result;
    };
    reader.readAsDataURL(file);
  });
}

function renderThumbs() {
  const el = document.getElementById('thumbs');
  el.innerHTML = '';
  photos.forEach(function(p, i) {
    const div = document.createElement('div');
    div.className = 'thumb';
    div.innerHTML = '<img src="' + p.previewUrl + '">' +
      '<button type="button" class="remove" data-i="' + i + '">×</button>';
    el.appendChild(div);
  });
  el.querySelectorAll('.remove').forEach(function(btn) {
    btn.addEventListener('click', function() {
      photos.splice(parseInt(btn.dataset.i), 1);
      renderThumbs();
    });
  });
}

document.getElementById('weldForm').addEventListener('submit', function(e) {
  e.preventDefault();
  if (photos.length === 0) {
    showStatus('err', 'Please add at least one photo.');
    return;
  }

  const btn = document.getElementById('submitBtn');
  btn.disabled = true;
  showStatus('busy', 'Uploading…');

  const payload = {
    action: 'submit',
    engineerName: document.getElementById('engineerName').value,
    customerName: document.getElementById('customerName').value,
    truckSerial: document.getElementById('truckSerial').value,
    truckModel: document.getElementById('truckModel').value,
    description: document.getElementById('description').value,
    photos: photos.map(function(p) { return { base64: p.base64, mimeType: p.mimeType }; })
  };

  fetch(GAS_URL, {
    method: 'POST',
    body: JSON.stringify(payload)
  })
  .then(function(r) { return r.json(); })
  .then(function(res) {
    if (res.success) {
      showStatus('ok', 'Sent to Mike — reference ' + res.id + '. He\'ll take a look before you head out.');
      document.getElementById('weldForm').reset();
      photos = [];
      renderThumbs();
    } else {
      showStatus('err', 'Something went wrong: ' + (res.error || 'unknown error'));
    }
  })
  .catch(function(err) {
    showStatus('err', 'Could not reach the server: ' + err.message);
  })
  .finally(function() {
    btn.disabled = false;
  });
});

function showStatus(type, msg) {
  const el = document.getElementById('status');
  el.className = 'status show ' + type;
  el.textContent = msg;
}
</script>

</body>
</html>
