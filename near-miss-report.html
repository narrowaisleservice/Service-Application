<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
   <script type="module" src="auth-guard.js"></script>
<meta name="theme-color" content="#df0a1e">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;600;700&family=DM+Sans:wght@400;500;700&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<title>Near Miss Report - Narrow Aisle Service Portal</title>
<style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { background: white !important; color-scheme: light only; }
    body {
        font-family: 'DM Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        color: #101010;
        min-height: 100vh;
    }

    .header {
        background: linear-gradient(135deg, #ffffff 0%, #fafafa 100%);
        border-bottom: 3px solid #df0a1e;
        padding: 24px 32px;
        position: sticky;
        top: 0;
        z-index: 50;
    }

    .back-link { font-size: 12px; color: #707070; text-decoration: none; font-weight: 600; }
    .back-link:hover { color: #df0a1e; }

    .header-title { font-family: 'IBM Plex Sans', sans-serif; font-size: 28px; font-weight: 700; margin-top: 4px; }
    .header-subtitle { font-size: 13px; color: #707070; margin-top: 2px; }

    .content { max-width: 1000px; margin: 0 auto; padding: 32px; }

    .stats-row {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
        gap: 16px;
        margin-bottom: 32px;
    }

    .stat-card {
        background: white;
        border: 1px solid #e8e8e8;
        border-radius: 12px;
        padding: 20px;
        border-top: 3px solid #df0a1e;
    }

    .stat-label {
        font-family: 'DM Mono', monospace;
        font-size: 10px;
        font-weight: 500;
        color: #606060;
        text-transform: uppercase;
        letter-spacing: 0.5px;
        margin-bottom: 8px;
    }

    .stat-value {
        font-family: 'IBM Plex Sans', sans-serif;
        font-size: 28px;
        font-weight: 700;
        color: #101010;
    }

    .panel {
        background: white;
        border: 1px solid #e8e8e8;
        border-radius: 12px;
        padding: 28px;
        margin-bottom: 24px;
    }

    .panel-title {
        font-family: 'IBM Plex Sans', sans-serif;
        font-size: 18px;
        font-weight: 700;
        margin-bottom: 20px;
    }

    .form-grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
        gap: 16px;
        margin-bottom: 20px;
    }

    .form-group { display: flex; flex-direction: column; gap: 6px; }
    .form-group.full { grid-column: 1 / -1; }

    label {
        font-family: 'DM Mono', monospace;
        font-size: 10px;
        font-weight: 500;
        color: #606060;
        text-transform: uppercase;
        letter-spacing: 0.5px;
    }

    input, select, textarea {
        font-family: 'DM Sans', sans-serif;
        font-size: 14px;
        padding: 12px 14px;
        border: 1px solid #ddd;
        border-radius: 8px;
        color: #101010;
        background: white;
    }

    input:focus, select:focus, textarea:focus {
        outline: none;
        border-color: #df0a1e;
    }

    textarea { resize: vertical; min-height: 70px; }

    .submit-btn {
        padding: 14px 32px;
        background: #df0a1e;
        border: none;
        border-radius: 8px;
        color: white;
        font-family: 'IBM Plex Sans', sans-serif;
        font-size: 13px;
        font-weight: 700;
        text-transform: uppercase;
        letter-spacing: 0.3px;
        cursor: pointer;
        transition: all 0.2s ease;
    }

    .submit-btn:hover { background: #c3161e; transform: translateY(-2px); box-shadow: 0 4px 12px rgba(223,10,30,0.3); }
    .submit-btn:disabled { opacity: 0.6; cursor: not-allowed; transform: none; box-shadow: none; }

    .table-toolbar {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 16px;
        gap: 12px;
        flex-wrap: wrap;
    }

    .search-input { flex: 1; min-width: 200px; }

    .report-card {
        background: white;
        border: 1px solid #e8e8e8;
        border-left: 4px solid #df0a1e;
        border-radius: 10px;
        padding: 18px 22px;
        margin-bottom: 12px;
        cursor: pointer;
        transition: all 0.2s ease;
    }

    .report-card:hover { box-shadow: 0 8px 24px rgba(223,10,30,0.1); transform: translateY(-2px); }

    .report-top {
        display: flex;
        justify-content: space-between;
        align-items: flex-start;
        gap: 16px;
        margin-bottom: 6px;
    }

    .report-category { font-family: 'IBM Plex Sans', sans-serif; font-size: 15px; font-weight: 700; }
    .report-date { font-family: 'DM Mono', monospace; font-size: 12px; color: #df0a1e; font-weight: 500; white-space: nowrap; }

    .report-meta { font-size: 13px; color: #707070; display: flex; gap: 16px; flex-wrap: wrap; }
    .report-meta span strong { color: #101010; font-weight: 600; }

    .report-detail {
        display: none;
        margin-top: 14px;
        padding-top: 14px;
        border-top: 1px solid #f0f0f0;
        font-size: 14px;
        line-height: 1.6;
    }
    .report-card.expanded .report-detail { display: block; }

    .detail-label {
        font-family: 'DM Mono', monospace;
        font-size: 10px;
        font-weight: 500;
        color: #606060;
        text-transform: uppercase;
        letter-spacing: 0.5px;
        margin-bottom: 4px;
        margin-top: 10px;
    }
    .detail-label:first-child { margin-top: 0; }

    .empty-state, .loading-state {
        text-align: center;
        padding: 40px;
        color: #909090;
        font-size: 14px;
    }

    .toast {
        position: fixed;
        bottom: 24px;
        right: 24px;
        padding: 14px 22px;
        border-radius: 8px;
        color: white;
        font-size: 13px;
        font-weight: 600;
        opacity: 0;
        transform: translateY(10px);
        transition: all 0.3s ease;
        pointer-events: none;
        z-index: 300;
    }
    .toast.show { opacity: 1; transform: translateY(0); }
    .toast.success { background: #4caf50; }
    .toast.error { background: #df0a1e; }

    @media (max-width: 640px) {
        .header { padding: 16px 20px; }
        .header-title { font-size: 22px; }
        .content { padding: 16px; }
        .report-top { flex-direction: column; }
    }
</style>
</head>
<body>

<div class="header">
    <a class="back-link" href="portal-hub-professional.html">&larr; Back to Portal</a>
    <div class="header-title">Near Miss Report</div>
    <div class="header-subtitle">Report near misses and hazards</div>
</div>

<div class="content">

    <div class="stats-row">
        <div class="stat-card">
            <div class="stat-label">This Week</div>
            <div class="stat-value" id="statWeek">0</div>
        </div>
        <div class="stat-card">
            <div class="stat-label">This Month</div>
            <div class="stat-value" id="statMonth">0</div>
        </div>
        <div class="stat-card">
            <div class="stat-label">Total Reports</div>
            <div class="stat-value" id="statTotal">0</div>
        </div>
    </div>

    <div class="panel">
        <div class="panel-title">Report a Near Miss</div>
        <form id="nearMissForm">
            <div class="form-grid">
                <div class="form-group">
                    <label for="date">Date</label>
                    <input type="date" id="date" required>
                </div>
                <div class="form-group">
                    <label for="time">Time</label>
                    <input type="time" id="time" required>
                </div>
                <div class="form-group">
                    <label for="location">Location</label>
                    <input type="text" id="location" placeholder="Site / area" required>
                </div>
                <div class="form-group">
                    <label for="category">Category</label>
                    <select id="category">
                        <option value="Slip, Trip or Fall">Slip, Trip or Fall</option>
                        <option value="Manual Handling">Manual Handling</option>
                        <option value="Vehicle / FLT">Vehicle / FLT</option>
                        <option value="Equipment / Tools">Equipment / Tools</option>
                        <option value="Falling Object">Falling Object</option>
                        <option value="Electrical">Electrical</option>
                        <option value="Chemical / COSHH">Chemical / COSHH</option>
                        <option value="Other">Other</option>
                    </select>
                </div>
                <div class="form-group full">
                    <label for="description">What happened</label>
                    <textarea id="description" placeholder="Describe the near miss or hazard" required></textarea>
                </div>
                <div class="form-group full">
                    <label for="immediateAction">Immediate action taken</label>
                    <textarea id="immediateAction" placeholder="What was done at the time, if anything"></textarea>
                </div>
                <div class="form-group full">
                    <label for="witnesses">Witnesses</label>
                    <input type="text" id="witnesses" placeholder="Optional">
                </div>
            </div>
            <button type="submit" class="submit-btn" id="submitBtn">Submit Report</button>
        </form>
    </div>

    <div class="panel">
        <div class="table-toolbar">
            <div class="panel-title" style="margin-bottom:0;">Recent Reports</div>
            <input type="text" class="search-input" id="searchInput" placeholder="Search location, category, description...">
        </div>
        <div id="reportsWrap">
            <div class="loading-state">Loading reports...</div>
        </div>
    </div>

</div>

<div class="toast" id="toast"></div>

<script>
    if (!localStorage.getItem('portalUser')) {
        window.location.href = 'login.html';
    }
    const portalName = localStorage.getItem('portalName') || 'Engineer';

    // ---- Set this to your deployed Apps Script Web App URL ----
    const GAS_URL = 'https://script.google.com/macros/s/AKfycbwY3rMwidBiY13FetpDunp-nSsKcQVZ_ul78giWytEg6aJ3lS6gKguVMXC1q_gOO17A9A/exec';

    document.getElementById('date').valueAsDate = new Date();

    let allReports = [];

    function showToast(message, type) {
        const toast = document.getElementById('toast');
        toast.textContent = message;
        toast.className = 'toast show ' + type;
        setTimeout(() => { toast.className = 'toast ' + type; }, 3000);
    }

    function startOfWeek(d) {
        const date = new Date(d);
        const day = (date.getDay() + 6) % 7; // Monday = 0
        date.setHours(0,0,0,0);
        date.setDate(date.getDate() - day);
        return date;
    }

    function renderStats(reports) {
        const now = new Date();
        const weekStart = startOfWeek(now);
        const monthStart = new Date(now.getFullYear(), now.getMonth(), 1);

        let weekCount = 0, monthCount = 0;
        reports.forEach(r => {
            const d = new Date(r['Date']);
            if (d >= monthStart) monthCount++;
            if (d >= weekStart) weekCount++;
        });

        document.getElementById('statWeek').textContent = weekCount;
        document.getElementById('statMonth').textContent = monthCount;
        document.getElementById('statTotal').textContent = reports.length;
    }

    function formatDate(val) {
        if (!val) return '';
        const d = new Date(val);
        if (isNaN(d)) return val;
        return d.toLocaleDateString('en-GB');
    }

    function renderReports(reports) {
        const wrap = document.getElementById('reportsWrap');
        if (!reports.length) {
            wrap.innerHTML = '<div class="empty-state">No near miss reports yet.</div>';
            return;
        }

        wrap.innerHTML = reports.map((r, i) => `
            <div class="report-card" data-idx="${i}">
                <div class="report-top">
                    <div class="report-category">${r['Category'] || 'Near Miss'}</div>
                    <div class="report-date">${formatDate(r['Date'])} ${r['Time'] || ''}</div>
                </div>
                <div class="report-meta">
                    <span><strong>Location:</strong> ${r['Location'] || '—'}</span>
                    <span><strong>Reported by:</strong> ${r['ReportedBy'] || '—'}</span>
                </div>
                <div class="report-detail">
                    <div class="detail-label">What Happened</div>
                    <div>${r['Description'] || '—'}</div>

                    <div class="detail-label">Immediate Action Taken</div>
                    <div>${r['ImmediateAction'] || '—'}</div>

                    <div class="detail-label">Witnesses</div>
                    <div>${r['Witnesses'] || '—'}</div>
                </div>
            </div>
        `).join('');

        wrap.querySelectorAll('.report-card').forEach(card => {
            card.addEventListener('click', () => card.classList.toggle('expanded'));
        });
    }

    function applySearch() {
        const term = document.getElementById('searchInput').value.trim().toLowerCase();
        if (!term) { renderReports(allReports); return; }
        const filtered = allReports.filter(r =>
            Object.values(r).some(v => String(v).toLowerCase().includes(term))
        );
        renderReports(filtered);
    }

    document.getElementById('searchInput').addEventListener('input', applySearch);

    function loadReports() {
        fetch(`${GAS_URL}?action=list`)
            .then(r => r.json())
            .then(res => {
                allReports = res.reports || [];
                renderStats(allReports);
                renderReports(allReports);
            })
            .catch(() => {
                document.getElementById('reportsWrap').innerHTML = '<div class="empty-state">Could not load reports. Check the connection.</div>';
            });
    }

    document.getElementById('nearMissForm').addEventListener('submit', function (e) {
        e.preventDefault();
        const btn = document.getElementById('submitBtn');
        btn.disabled = true;
        btn.textContent = 'Submitting...';

        const data = {
            date: document.getElementById('date').value,
            time: document.getElementById('time').value,
            location: document.getElementById('location').value,
            category: document.getElementById('category').value,
            description: document.getElementById('description').value,
            immediateAction: document.getElementById('immediateAction').value,
            witnesses: document.getElementById('witnesses').value,
            reportedBy: portalName
        };

        fetch(`${GAS_URL}?data=${encodeURIComponent(JSON.stringify(data))}`)
            .then(r => r.json())
            .then(res => {
                if (res.success) {
                    showToast('Report submitted', 'success');
                    document.getElementById('nearMissForm').reset();
                    document.getElementById('date').valueAsDate = new Date();
                    loadReports();
                } else {
                    showToast('Something went wrong', 'error');
                }
            })
            .catch(() => showToast('Could not reach the server', 'error'))
            .finally(() => {
                btn.disabled = false;
                btn.textContent = 'Submit Report';
            });
    });

    loadReports();
</script>
</body>
</html>
