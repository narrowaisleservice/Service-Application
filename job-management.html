<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#df0a1e">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;600;700&family=DM+Sans:wght@400;500;700&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<title>Job Management - Narrow Aisle Service Portal</title>
<style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { background: white !important; color-scheme: light only; }
    body {
        font-family: 'DM Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        color: #101010;
        min-height: 100vh;
    }

    .header {
        background: linear-gradient(135deg, #ffffff 0%, #fafafa 100%);
        border-bottom: 3px solid #df0a1e;
        padding: 24px 32px;
        position: sticky;
        top: 0;
        z-index: 50;
    }

    .back-link { font-size: 12px; color: #707070; text-decoration: none; font-weight: 600; }
    .back-link:hover { color: #df0a1e; }

    .header-title { font-family: 'IBM Plex Sans', sans-serif; font-size: 28px; font-weight: 700; margin-top: 4px; }
    .header-subtitle { font-size: 13px; color: #707070; margin-top: 2px; }

    .content { max-width: 1100px; margin: 0 auto; padding: 32px; }

    .toolbar {
        display: flex;
        gap: 12px;
        margin-bottom: 20px;
        flex-wrap: wrap;
    }

    .toolbar input[type="text"], .toolbar select {
        font-family: 'DM Sans', sans-serif;
        font-size: 14px;
        padding: 12px 16px;
        border: 1px solid #ddd;
        border-radius: 8px;
        color: #101010;
    }

    .toolbar input[type="text"] { flex: 1; min-width: 200px; }
    .toolbar input[type="text"]:focus, .toolbar select:focus { outline: none; border-color: #df0a1e; }

    .btn-new {
        padding: 12px 24px;
        background: #df0a1e;
        border: none;
        border-radius: 8px;
        color: white;
        font-family: 'IBM Plex Sans', sans-serif;
        font-size: 13px;
        font-weight: 700;
        text-transform: uppercase;
        letter-spacing: 0.3px;
        cursor: pointer;
        transition: all 0.2s ease;
        white-space: nowrap;
    }
    .btn-new:hover { background: #c3161e; transform: translateY(-2px); box-shadow: 0 4px 12px rgba(223,10,30,0.3); }

    .result-count {
        font-family: 'DM Mono', monospace;
        font-size: 12px;
        color: #707070;
        margin-bottom: 16px;
        text-transform: uppercase;
        letter-spacing: 0.3px;
    }

    .job-list { display: flex; flex-direction: column; gap: 12px; }

    .job-card {
        background: white;
        border: 1px solid #e8e8e8;
        border-radius: 12px;
        padding: 18px 20px;
        cursor: pointer;
        transition: all 0.2s ease;
        display: grid;
        grid-template-columns: 100px 1fr 140px 120px;
        gap: 16px;
        align-items: center;
    }
    .job-card:hover { border-color: #df0a1e; box-shadow: 0 8px 20px rgba(223,10,30,0.1); }

    .job-id { font-family: 'DM Mono', monospace; font-size: 12px; color: #707070; }

    .job-main .job-customer { font-family: 'IBM Plex Sans', sans-serif; font-weight: 700; font-size: 15px; }
    .job-main .job-meta { font-size: 12px; color: #707070; margin-top: 4px; }

    .job-priority { font-size: 12px; font-weight: 600; text-align: center; }
    .job-priority.critical { color: #ff6b6b; }
    .job-priority.high { color: #ffa940; }
    .job-priority.medium { color: #faad14; }
    .job-priority.low { color: #52c41a; }

    .status-badge {
        font-family: 'DM Mono', monospace;
        font-size: 10px;
        font-weight: 600;
        text-transform: uppercase;
        letter-spacing: 0.4px;
        padding: 6px 10px;
        border-radius: 6px;
        text-align: center;
        color: white;
    }
    .status-badge.new { background: #909090; }
    .status-badge.scheduled { background: #2f80ed; }
    .status-badge.in-progress { background: #faad14; }
    .status-badge.on-hold { background: #ffa940; }
    .status-badge.completed { background: #52c41a; }
    .status-badge.cancelled { background: #c0c0c0; color: #707070; }

    .empty-state, .loading-state, .error-state {
        text-align: center;
        padding: 60px 20px;
        color: #909090;
        font-size: 14px;
    }
    .error-state { color: #df0a1e; }

    /* Modal (shared by New Job + Edit Job) */
    .modal-overlay {
        display: none;
        position: fixed;
        inset: 0;
        background: rgba(0,0,0,0.5);
        z-index: 300;
        align-items: center;
        justify-content: center;
        padding: 20px;
    }
    .modal-overlay.show { display: flex; }

    .modal {
        background: white;
        border-radius: 12px;
        width: 100%;
        max-width: 560px;
        max-height: 90vh;
        overflow-y: auto;
        padding: 28px;
    }

    .modal-title {
        font-family: 'IBM Plex Sans', sans-serif;
        font-size: 20px;
        font-weight: 700;
        margin-bottom: 20px;
        display: flex;
        justify-content: space-between;
        align-items: center;
    }

    .modal-close {
        background: none;
        border: none;
        font-size: 22px;
        cursor: pointer;
        color: #707070;
        line-height: 1;
    }
    .modal-close:hover { color: #df0a1e; }

    .form-group { margin-bottom: 18px; }
    .form-group.inline { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
    .form-group.inline .form-group { margin-bottom: 0; }

    .form-group label {
        display: block;
        font-family: 'IBM Plex Sans', sans-serif;
        font-size: 12px;
        font-weight: 700;
        color: #101010;
        margin-bottom: 6px;
        text-transform: uppercase;
        letter-spacing: 0.3px;
    }

    .form-group input, .form-group select, .form-group textarea {
        width: 100%;
        padding: 10px 14px;
        border: 2px solid #e0e0e0;
        border-radius: 8px;
        font-family: 'DM Sans', sans-serif;
        font-size: 14px;
        color: #101010;
    }
    .form-group input:focus, .form-group select:focus, .form-group textarea:focus {
        outline: none;
        border-color: #df0a1e;
    }
    .form-group textarea { resize: vertical; min-height: 80px; }

    .priority-buttons { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
    .priority-btn {
        padding: 10px 6px;
        border: 2px solid #e0e0e0;
        border-radius: 8px;
        background: white;
        cursor: pointer;
        font-weight: 600;
        font-size: 12px;
        text-align: center;
        transition: all 0.2s ease;
    }
    .priority-btn.critical { border-color: #ff6b6b; color: #ff6b6b; }
    .priority-btn.high { border-color: #ffa940; color: #ffa940; }
    .priority-btn.medium { border-color: #faad14; color: #faad14; }
    .priority-btn.low { border-color: #52c41a; color: #52c41a; }
    .priority-btn.active { color: white; }
    .priority-btn.critical.active { background: #ff6b6b; }
    .priority-btn.high.active { background: #ffa940; }
    .priority-btn.medium.active { background: #faad14; }
    .priority-btn.low.active { background: #52c41a; }

    .modal-actions { display: flex; gap: 12px; margin-top: 8px; }
    .btn {
        flex: 1;
        padding: 13px 20px;
        border: none;
        border-radius: 8px;
        font-family: 'IBM Plex Sans', sans-serif;
        font-size: 13px;
        font-weight: 700;
        text-transform: uppercase;
        letter-spacing: 0.3px;
        cursor: pointer;
        transition: all 0.2s ease;
    }
    .btn-submit { background: #df0a1e; color: white; }
    .btn-submit:hover { background: #c3161e; }
    .btn-submit:disabled { background: #ccc; cursor: not-allowed; }
    .btn-cancel { background: #f0f0f0; color: #101010; }
    .btn-cancel:hover { background: #e0e0e0; }

    .modal-error {
        display: none;
        background: #f8d7da;
        border: 1px solid #f5c6cb;
        color: #721c24;
        padding: 12px 14px;
        border-radius: 8px;
        margin-bottom: 16px;
        font-size: 13px;
    }

    .detail-row { display: flex; justify-content: space-between; padding: 10px 0; border-bottom: 1px solid #f0f0f0; font-size: 13px; }
    .detail-row .label { color: #707070; }
    .detail-row .value { font-weight: 600; text-align: right; }

    @media (max-width: 640px) {
        .header { padding: 16px 20px; }
        .header-title { font-size: 22px; }
        .content { padding: 16px; }
        .job-card { grid-template-columns: 1fr; gap: 8px; }
        .job-priority { text-align: left; }
        .form-group.inline { grid-template-columns: 1fr; }
    }
</style>
</head>
<body>

<div class="header">
    <a class="back-link" href="portal-hub-professional.html">&larr; Back to Portal</a>
    <div class="header-title">Job Management</div>
    <div class="header-subtitle">Higher-level job and project tracking</div>
</div>

<div class="content">
    <div class="toolbar">
        <input type="text" id="searchInput" placeholder="Search customer, equipment, job ID...">
        <select id="statusFilter">
            <option value="">All statuses</option>
            <option value="New">New</option>
            <option value="Scheduled">Scheduled</option>
            <option value="In Progress">In Progress</option>
            <option value="On Hold">On Hold</option>
            <option value="Completed">Completed</option>
            <option value="Cancelled">Cancelled</option>
        </select>
        <button class="btn-new" id="newJobBtn">+ New Job</button>
    </div>
    <div class="result-count" id="resultCount"></div>
    <div class="job-list" id="jobList">
        <div class="loading-state">Loading jobs...</div>
    </div>
</div>

<!-- New Job Modal -->
<div class="modal-overlay" id="newJobModal">
    <div class="modal">
        <div class="modal-title">
            New Job
            <button class="modal-close" id="newJobClose">&times;</button>
        </div>
        <div class="modal-error" id="newJobError"></div>
        <form id="newJobForm">
            <div class="form-group inline">
                <div class="form-group">
                    <label for="njCustomer">Customer / Site</label>
                    <input type="text" id="njCustomer" required>
                </div>
                <div class="form-group">
                    <label for="njEquipment">Equipment / Truck ID</label>
                    <input type="text" id="njEquipment">
                </div>
            </div>
            <div class="form-group inline">
                <div class="form-group">
                    <label for="njJobType">Job Type</label>
                    <select id="njJobType" required>
                        <option value="">Select type...</option>
                        <option>Breakdown</option>
                        <option>Planned Maintenance</option>
                        <option>Installation</option>
                        <option>Inspection</option>
                        <option>Parts Fitting</option>
                        <option>Other</option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="njEngineer">Assigned Engineer</label>
                    <input type="text" id="njEngineer">
                </div>
            </div>
            <div class="form-group">
                <label>Priority</label>
                <div class="priority-buttons" id="njPriorityButtons">
                    <button type="button" class="priority-btn critical" data-priority="Critical">Critical</button>
                    <button type="button" class="priority-btn high" data-priority="High">High</button>
                    <button type="button" class="priority-btn medium active" data-priority="Medium">Medium</button>
                    <button type="button" class="priority-btn low" data-priority="Low">Low</button>
                </div>
                <input type="hidden" id="njPriority" value="Medium">
            </div>
            <div class="form-group">
                <label for="njScheduledDate">Scheduled Date</label>
                <input type="date" id="njScheduledDate">
            </div>
            <div class="form-group">
                <label for="njDescription">Description</label>
                <textarea id="njDescription" placeholder="What does this job involve?"></textarea>
            </div>
            <div class="modal-actions">
                <button type="button" class="btn btn-cancel" id="newJobCancel">Cancel</button>
                <button type="submit" class="btn btn-submit" id="newJobSubmit">Create Job</button>
            </div>
        </form>
    </div>
</div>

<!-- Edit / Detail Modal -->
<div class="modal-overlay" id="editJobModal">
    <div class="modal">
        <div class="modal-title">
            <span id="editJobId">Job</span>
            <button class="modal-close" id="editJobClose">&times;</button>
        </div>
        <div class="modal-error" id="editJobError"></div>

        <div id="editJobDetails"></div>

        <form id="editJobForm">
            <div class="form-group">
                <label for="ejStatus">Status</label>
                <select id="ejStatus">
                    <option>New</option>
                    <option>Scheduled</option>
                    <option>In Progress</option>
                    <option>On Hold</option>
                    <option>Completed</option>
                    <option>Cancelled</option>
                </select>
            </div>
            <div class="form-group inline">
                <div class="form-group">
                    <label for="ejEngineer">Assigned Engineer</label>
                    <input type="text" id="ejEngineer">
                </div>
                <div class="form-group">
                    <label for="ejScheduledDate">Scheduled Date</label>
                    <input type="date" id="ejScheduledDate">
                </div>
            </div>
            <div class="form-group">
                <label for="ejNotes">Notes</label>
                <textarea id="ejNotes" placeholder="Updates, progress notes..."></textarea>
            </div>
            <div class="modal-actions">
                <button type="button" class="btn btn-cancel" id="editJobCancel">Close</button>
                <button type="submit" class="btn btn-submit" id="editJobSubmit">Save Changes</button>
            </div>
        </form>
    </div>
</div>

<script>
    if (!localStorage.getItem('portalUser')) {
        window.location.href = 'login.html';
    }

    // UPDATE THIS with your GAS deployment URL once you've created and deployed the backend
    const GAS_URL = "PASTE_YOUR_GAS_DEPLOYMENT_URL_HERE";

    let allJobs = [];
    let currentEditId = null;

    function statusClass(status) {
        return (status || 'new').toLowerCase().replace(/\s+/g, '-');
    }

    function priorityClass(priority) {
        return (priority || 'medium').toLowerCase();
    }

    function formatDate(d) {
        if (!d) return '—';
        const date = new Date(d);
        if (isNaN(date)) return d;
        return date.toLocaleDateString('en-GB', { day: '2-digit', month: 'short', year: 'numeric' });
    }

    function loadJobs() {
        document.getElementById('jobList').innerHTML = '<div class="loading-state">Loading jobs...</div>';
        fetch(`${GAS_URL}?action=list`)
            .then(r => r.json())
            .then(res => {
                if (!res.success) {
                    document.getElementById('jobList').innerHTML = `<div class="error-state">${res.error || 'Could not load jobs.'}</div>`;
                    return;
                }
                allJobs = res.jobs || [];
                renderJobs(allJobs);
            })
            .catch(() => {
                document.getElementById('jobList').innerHTML = '<div class="error-state">Could not reach the job backend. Check GAS_URL is set.</div>';
            });
    }

    function applyFilters() {
        const term = document.getElementById('searchInput').value.trim().toLowerCase();
        const status = document.getElementById('statusFilter').value;
        const filtered = allJobs.filter(j => {
            const matchesTerm = !term || [j.jobId, j.customer, j.equipment].some(v => (v || '').toLowerCase().includes(term));
            const matchesStatus = !status || j.status === status;
            return matchesTerm && matchesStatus;
        });
        renderJobs(filtered);
    }

    function renderJobs(list) {
        const container = document.getElementById('jobList');
        document.getElementById('resultCount').textContent = `${list.length} job${list.length === 1 ? '' : 's'}`;

        if (!list.length) {
            container.innerHTML = '<div class="empty-state">No jobs found.</div>';
            return;
        }

        container.innerHTML = list.map(j => `
            <div class="job-card" data-job-id="${j.jobId}">
                <div class="job-id">${j.jobId}</div>
                <div class="job-main">
                    <div class="job-customer">${j.customer || 'Unnamed job'}</div>
                    <div class="job-meta">${j.jobType || ''}${j.equipment ? ' · ' + j.equipment : ''}${j.assignedEngineer ? ' · ' + j.assignedEngineer : ''}</div>
                </div>
                <div class="job-priority ${priorityClass(j.priority)}">${j.priority || ''}</div>
                <div class="status-badge ${statusClass(j.status)}">${j.status || 'New'}</div>
            </div>
        `).join('');

        container.querySelectorAll('.job-card').forEach(card => {
            card.addEventListener('click', () => openEditModal(card.dataset.jobId));
        });
    }

    document.getElementById('searchInput').addEventListener('input', applyFilters);
    document.getElementById('statusFilter').addEventListener('change', applyFilters);

    // ── New Job modal ──
    const newJobModal = document.getElementById('newJobModal');
    const njPriorityButtons = document.querySelectorAll('#njPriorityButtons .priority-btn');
    const njPriorityInput = document.getElementById('njPriority');

    document.getElementById('newJobBtn').addEventListener('click', () => {
        document.getElementById('newJobForm').reset();
        njPriorityButtons.forEach(b => b.classList.remove('active'));
        njPriorityButtons[2].classList.add('active');
        njPriorityInput.value = 'Medium';
        document.getElementById('newJobError').style.display = 'none';
        newJobModal.classList.add('show');
    });
    document.getElementById('newJobClose').addEventListener('click', () => newJobModal.classList.remove('show'));
    document.getElementById('newJobCancel').addEventListener('click', () => newJobModal.classList.remove('show'));

    njPriorityButtons.forEach(btn => {
        btn.addEventListener('click', () => {
            njPriorityButtons.forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            njPriorityInput.value = btn.dataset.priority;
        });
    });

    document.getElementById('newJobForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        const submitBtn = document.getElementById('newJobSubmit');
        const errorBox = document.getElementById('newJobError');
        errorBox.style.display = 'none';
        submitBtn.disabled = true;

        const payload = {
            action: 'addJob',
            customer: document.getElementById('njCustomer').value.trim(),
            equipment: document.getElementById('njEquipment').value.trim(),
            jobType: document.getElementById('njJobType').value,
            priority: njPriorityInput.value,
            assignedEngineer: document.getElementById('njEngineer').value.trim(),
            status: 'New',
            scheduledDate: document.getElementById('njScheduledDate').value,
            description: document.getElementById('njDescription').value.trim()
        };

        try {
            const response = await fetch(GAS_URL, { method: 'POST', body: JSON.stringify(payload) });
            const result = await response.json();
            if (!result.success) throw new Error(result.error || 'Failed to create job');
            newJobModal.classList.remove('show');
            loadJobs();
        } catch (err) {
            errorBox.textContent = '❌ ' + err.message;
            errorBox.style.display = 'block';
        } finally {
            submitBtn.disabled = false;
        }
    });

    // ── Edit / Detail modal ──
    const editJobModal = document.getElementById('editJobModal');

    function openEditModal(jobId) {
        const job = allJobs.find(j => j.jobId === jobId);
        if (!job) return;
        currentEditId = jobId;

        document.getElementById('editJobId').textContent = job.jobId;
        document.getElementById('editJobError').style.display = 'none';

        document.getElementById('editJobDetails').innerHTML = `
            <div class="detail-row"><span class="label">Customer / Site</span><span class="value">${job.customer || '—'}</span></div>
            <div class="detail-row"><span class="label">Equipment</span><span class="value">${job.equipment || '—'}</span></div>
            <div class="detail-row"><span class="label">Job Type</span><span class="value">${job.jobType || '—'}</span></div>
            <div class="detail-row"><span class="label">Priority</span><span class="value">${job.priority || '—'}</span></div>
            <div class="detail-row"><span class="label">Description</span><span class="value">${job.description || '—'}</span></div>
            <div class="detail-row"><span class="label">Created</span><span class="value">${formatDate(job.timestamp)}</span></div>
        `;

        document.getElementById('ejStatus').value = job.status || 'New';
        document.getElementById('ejEngineer').value = job.assignedEngineer || '';
        document.getElementById('ejScheduledDate').value = job.scheduledDate ? job.scheduledDate.slice(0, 10) : '';
        document.getElementById('ejNotes').value = job.notes || '';

        editJobModal.classList.add('show');
    }

    document.getElementById('editJobClose').addEventListener('click', () => editJobModal.classList.remove('show'));
    document.getElementById('editJobCancel').addEventListener('click', () => editJobModal.classList.remove('show'));

    document.getElementById('editJobForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        const submitBtn = document.getElementById('editJobSubmit');
        const errorBox = document.getElementById('editJobError');
        errorBox.style.display = 'none';
        submitBtn.disabled = true;

        const payload = {
            action: 'updateJob',
            jobId: currentEditId,
            status: document.getElementById('ejStatus').value,
            assignedEngineer: document.getElementById('ejEngineer').value.trim(),
            scheduledDate: document.getElementById('ejScheduledDate').value,
            notes: document.getElementById('ejNotes').value.trim()
        };

        try {
            const response = await fetch(GAS_URL, { method: 'POST', body: JSON.stringify(payload) });
            const result = await response.json();
            if (!result.success) throw new Error(result.error || 'Failed to update job');
            editJobModal.classList.remove('show');
            loadJobs();
        } catch (err) {
            errorBox.textContent = '❌ ' + err.message;
            errorBox.style.display = 'block';
        } finally {
            submitBtn.disabled = false;
        }
    });

    loadJobs();
</script>
</body>
</html>
