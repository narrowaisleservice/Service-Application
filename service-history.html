<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#df0a1e">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;600;700&family=DM+Sans:wght@400;500;700&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<title>Service History - Narrow Aisle Service Portal</title>
<style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { background: white !important; color-scheme: light only; }
    body {
        font-family: 'DM Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        color: #101010;
        min-height: 100vh;
    }

    .header {
        background: linear-gradient(135deg, #ffffff 0%, #fafafa 100%);
        border-bottom: 3px solid #df0a1e;
        padding: 24px 32px;
        position: sticky;
        top: 0;
        z-index: 50;
    }

    .back-link { font-size: 12px; color: #707070; text-decoration: none; font-weight: 600; }
    .back-link:hover { color: #df0a1e; }

    .header-title { font-family: 'IBM Plex Sans', sans-serif; font-size: 28px; font-weight: 700; margin-top: 4px; }
    .header-subtitle { font-size: 13px; color: #707070; margin-top: 2px; }

    .content { max-width: 1000px; margin: 0 auto; padding: 32px; }

    .search-panel {
        background: white;
        border: 1px solid #e8e8e8;
        border-radius: 12px;
        padding: 24px;
        margin-bottom: 24px;
        display: flex;
        gap: 12px;
    }

    .search-panel input {
        flex: 1;
        font-family: 'DM Mono', monospace;
        font-size: 16px;
        padding: 14px 16px;
        border: 1px solid #ddd;
        border-radius: 8px;
        color: #101010;
        text-transform: uppercase;
    }

    .search-panel input:focus { outline: none; border-color: #df0a1e; }

    .search-btn {
        padding: 14px 28px;
        background: #df0a1e;
        border: none;
        border-radius: 8px;
        color: white;
        font-family: 'IBM Plex Sans', sans-serif;
        font-size: 13px;
        font-weight: 700;
        text-transform: uppercase;
        letter-spacing: 0.3px;
        cursor: pointer;
        transition: all 0.2s ease;
    }
    .search-btn:hover { background: #c3161e; }
    .search-btn:disabled { opacity: 0.6; cursor: not-allowed; }

    .result-count {
        font-family: 'DM Mono', monospace;
        font-size: 12px;
        color: #707070;
        margin-bottom: 16px;
        text-transform: uppercase;
        letter-spacing: 0.3px;
    }

    .multi-truck-note {
        background: #fafafa;
        border: 1px solid #e8e8e8;
        border-radius: 10px;
        padding: 14px 18px;
        font-size: 13px;
        color: #707070;
        margin-bottom: 20px;
    }

    /* ===== Insights panel ===== */
    .insights {
        margin-bottom: 28px;
    }

    .truck-banner {
        background: #0a0a0a;
        border-radius: 16px;
        padding: 24px 28px;
        margin-bottom: 16px;
        position: relative;
        overflow: hidden;
    }
    .truck-banner::before {
        content: '';
        position: absolute;
        top: -40%;
        right: -10%;
        width: 300px;
        height: 300px;
        background: radial-gradient(circle, rgba(223,10,30,0.35) 0%, transparent 70%);
        pointer-events: none;
    }
    .truck-serial {
        position: relative;
        font-family: 'DM Mono', monospace;
        font-size: 12px;
        letter-spacing: 1.5px;
        color: #a0a0a0;
        text-transform: uppercase;
        margin-bottom: 4px;
    }
    .truck-model {
        position: relative;
        font-family: 'IBM Plex Sans', sans-serif;
        font-size: 22px;
        font-weight: 700;
        color: #ffffff;
    }

    .stats-row {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(130px, 1fr));
        gap: 12px;
        margin-bottom: 16px;
    }
    .stat-card {
        background: #fafafa;
        border: 1px solid #eee;
        border-radius: 12px;
        padding: 16px;
    }
    .stat-value {
        font-family: 'IBM Plex Sans', sans-serif;
        font-size: 26px;
        font-weight: 700;
        color: #df0a1e;
        line-height: 1;
    }
    .stat-value.neutral { color: #101010; }
    .stat-label {
        font-family: 'DM Sans', sans-serif;
        font-size: 10.5px;
        color: #707070;
        text-transform: uppercase;
        letter-spacing: 0.4px;
        margin-top: 6px;
    }

    .charts-row {
        display: grid;
        grid-template-columns: 1.4fr 1fr;
        gap: 16px;
        margin-bottom: 16px;
    }
    .chart-card {
        background: white;
        border: 1px solid #e8e8e8;
        border-radius: 12px;
        padding: 20px;
    }
    .chart-card h3 {
        font-family: 'IBM Plex Sans', sans-serif;
        font-size: 13px;
        font-weight: 700;
        margin-bottom: 14px;
        color: #101010;
    }
    .chart-card canvas { max-height: 220px; }
    .donut-wrap { position: relative; height: 220px; display: flex; align-items: center; justify-content: center; }

    .issues-card {
        background: white;
        border: 1px solid #e8e8e8;
        border-radius: 12px;
        padding: 20px;
        margin-bottom: 8px;
    }
    .issues-card h3 {
        font-family: 'IBM Plex Sans', sans-serif;
        font-size: 13px;
        font-weight: 700;
        margin-bottom: 4px;
        color: #101010;
    }
    .issues-sub {
        font-size: 12px;
        color: #909090;
        margin-bottom: 16px;
    }
    .issue-row {
        display: flex;
        align-items: center;
        gap: 12px;
        margin-bottom: 12px;
    }
    .issue-row:last-child { margin-bottom: 0; }
    .issue-icon {
        width: 34px; height: 34px;
        border-radius: 9px;
        background: rgba(223,10,30,0.07);
        border: 1px solid rgba(223,10,30,0.14);
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 16px;
        flex-shrink: 0;
    }
    .issue-main { flex: 1; min-width: 0; }
    .issue-top-line {
        display: flex;
        justify-content: space-between;
        font-size: 13px;
        margin-bottom: 5px;
    }
    .issue-name { font-weight: 600; color: #101010; }
    .issue-count { font-family: 'DM Mono', monospace; color: #df0a1e; font-weight: 500; }
    .issue-bar-track {
        background: #f0f0f0;
        border-radius: 4px;
        height: 6px;
        overflow: hidden;
    }
    .issue-bar-fill {
        background: linear-gradient(90deg, #df0a1e, #ff5a6a);
        height: 100%;
        border-radius: 4px;
    }
    .no-issues { font-size: 13px; color: #909090; padding: 8px 0; }

    .list-header {
        font-family: 'IBM Plex Sans', sans-serif;
        font-size: 13px;
        font-weight: 700;
        color: #101010;
        margin: 28px 0 12px;
    }

    .job-card {
        background: white;
        border: 1px solid #e8e8e8;
        border-left: 4px solid #df0a1e;
        border-radius: 10px;
        padding: 20px 24px;
        margin-bottom: 14px;
        cursor: pointer;
        transition: all 0.2s ease;
    }

    .job-card:hover { box-shadow: 0 8px 24px rgba(223,10,30,0.1); transform: translateY(-2px); }

    .job-top {
        display: flex;
        justify-content: space-between;
        align-items: flex-start;
        gap: 16px;
        margin-bottom: 8px;
    }

    .job-desc { font-family: 'IBM Plex Sans', sans-serif; font-size: 16px; font-weight: 700; }

    .job-date { font-family: 'DM Mono', monospace; font-size: 12px; color: #df0a1e; font-weight: 500; white-space: nowrap; }

    .job-meta { font-size: 13px; color: #707070; display: flex; gap: 16px; flex-wrap: wrap; }
    .job-meta span strong { color: #101010; font-weight: 600; }

    .job-detail {
        display: none;
        margin-top: 16px;
        padding-top: 16px;
        border-top: 1px solid #f0f0f0;
        font-size: 14px;
        line-height: 1.6;
        white-space: pre-line;
    }

    .job-card.expanded .job-detail { display: block; }

    .detail-label {
        font-family: 'DM Mono', monospace;
        font-size: 10px;
        font-weight: 500;
        color: #606060;
        text-transform: uppercase;
        letter-spacing: 0.5px;
        margin-bottom: 4px;
        margin-top: 12px;
    }
    .detail-label:first-child { margin-top: 0; }

    .empty-state, .loading-state {
        text-align: center;
        padding: 60px 20px;
        color: #909090;
        font-size: 14px;
    }

    @media (max-width: 768px) {
        .charts-row { grid-template-columns: 1fr; }
    }

    @media (max-width: 640px) {
        .header { padding: 16px 20px; }
        .header-title { font-size: 22px; }
        .content { padding: 16px; }
        .search-panel { flex-direction: column; }
        .job-top { flex-direction: column; }
    }
</style>
</head>
<body>

<div class="header">
    <a class="back-link" href="portal-hub-professional.html">&larr; Back to Portal</a>
    <div class="header-title">Service History</div>
    <div class="header-subtitle">Search job history by machine serial number</div>
</div>

<div class="content">
    <div class="search-panel">
        <input type="text" id="serialInput" placeholder="Enter serial number..." autofocus>
        <button class="search-btn" id="searchBtn">Search</button>
    </div>

    <div id="resultsWrap"></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js"></script>
<script>
    if (!localStorage.getItem('portalUser')) {
        window.location.href = 'login.html';
    }

    // ===== Supabase project config =====
    const SUPABASE_URL = 'https://dontubctlexlvifwhmbj.supabase.co';
    const SUPABASE_KEY = 'sb_publishable_99HLzSv4wMwFZHlR81yIsQ_z0A0Jpth';
    const db = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
    // =====================================

    // Keyword groups used to spot recurring issue patterns in the free-text
    // short_desc / to_do / work_report fields. A visit can match more than
    // one category (e.g. a hose leak found during a brake job).
    const ISSUE_CATEGORIES = [
        { key: 'brakes',      label: 'Brakes',           icon: '\u{1F6D1}', keywords: ['brake','handbrake','hand brake'] },
        { key: 'hydraulics',  label: 'Hydraulics & Leaks', icon: '\u{1F4A7}', keywords: ['hydraulic','hose','oil leak','cylinder','ram seal','spool valve','spool micro','leaking','leak from'] },
        { key: 'electrical',  label: 'Electrical',       icon: '\u26A1', keywords: ['electrical','wiring','contactor','fuse','battery','charger','connector','relay','microswitch','micro switch','keyswitch'] },
        { key: 'mast',        label: 'Mast & Chains',    icon: '\u{1F4D0}', keywords: ['mast','chain','carriage','bearing','tilt','freelift','roller'] },
        { key: 'steering',    label: 'Steering',         icon: '\u{1F3AF}', keywords: ['steering','steer motor','orbital','w61','eps'] },
        { key: 'wheels',      label: 'Wheels & Tyres',   icon: '\u{1F6DE}', keywords: ['wheel','tyre','tire','puncture'] },
        { key: 'seat',        label: 'Seat',             icon: '\u{1FA91}', keywords: ['seat','cushion'] },
        { key: 'drive',       label: 'Motor & Drive',    icon: '\u2699\uFE0F', keywords: ['drive motor','gearbox','transmission','drive fault',' motor '] },
    ];

    let charts = { timeline: null, type: null };

    function formatDate(val) {
        if (!val) return '';
        const d = new Date(val);
        if (isNaN(d)) return val;
        return d.toLocaleDateString('en-GB');
    }

    function destroyCharts() {
        if (charts.timeline) { charts.timeline.destroy(); charts.timeline = null; }
        if (charts.type) { charts.type.destroy(); charts.type = null; }
    }

    function classifyJobType(typeName) {
        const t = (typeName || '').toLowerCase();
        if (t.includes('breakdown')) return 'Breakdown';
        if (t.includes('service') || t.includes('preventative') || t.includes('inclusive')) return 'Service / PM';
        return 'Other';
    }

    function buildIssueCounts(jobs) {
        const counts = {};
        ISSUE_CATEGORIES.forEach(c => counts[c.key] = 0);
        jobs.forEach(job => {
            const blob = [job.short_desc, job.to_do, job.work_report].filter(Boolean).join(' \n ').toLowerCase();
            ISSUE_CATEGORIES.forEach(cat => {
                if (cat.keywords.some(kw => blob.includes(kw))) counts[cat.key]++;
            });
        });
        return ISSUE_CATEGORIES
            .map(c => ({ ...c, count: counts[c.key] }))
            .filter(c => c.count > 0)
            .sort((a, b) => b.count - a.count)
            .slice(0, 6);
    }

    function renderIssues(jobs) {
        const issues = buildIssueCounts(jobs);
        if (!issues.length) {
            return '<div class="no-issues">No recurring issue pattern detected in the notes for this truck.</div>';
        }
        const max = issues[0].count;
        return issues.map(c => `
            <div class="issue-row">
                <div class="issue-icon">${c.icon}</div>
                <div class="issue-main">
                    <div class="issue-top-line">
                        <span class="issue-name">${c.label}</span>
                        <span class="issue-count">${c.count} visit${c.count === 1 ? '' : 's'}</span>
                    </div>
                    <div class="issue-bar-track"><div class="issue-bar-fill" style="width:${Math.max(6, (c.count/max)*100)}%"></div></div>
                </div>
            </div>
        `).join('');
    }

    function renderInsights(jobs, serial) {
        const dates = jobs.map(j => j.visit_date).filter(Boolean).sort();
        const first = dates[0];
        const last = dates[dates.length - 1];
        const breakdownCount = jobs.filter(j => classifyJobType(j.job_type_name) === 'Breakdown').length;
        const serviceCount = jobs.filter(j => classifyJobType(j.job_type_name) === 'Service / PM').length;
        const withModel = jobs.find(j => j.make_model);
        const model = withModel ? withModel.make_model : '';

        return `
        <div class="insights">
            <div class="truck-banner">
                <div class="truck-serial">Serial ${serial}</div>
                <div class="truck-model">${model || 'Truck history'}</div>
            </div>
            <div class="stats-row">
                <div class="stat-card"><div class="stat-value neutral">${jobs.length}</div><div class="stat-label">Total Visits</div></div>
                <div class="stat-card"><div class="stat-value">${breakdownCount}</div><div class="stat-label">Breakdown Callouts</div></div>
                <div class="stat-card"><div class="stat-value neutral">${serviceCount}</div><div class="stat-label">Routine Services</div></div>
                <div class="stat-card"><div class="stat-value neutral" style="font-size:16px;">${formatDate(first)}</div><div class="stat-label">First Recorded</div></div>
                <div class="stat-card"><div class="stat-value neutral" style="font-size:16px;">${formatDate(last)}</div><div class="stat-label">Most Recent</div></div>
            </div>
            <div class="charts-row">
                <div class="chart-card">
                    <h3>Visits Over Time</h3>
                    <canvas id="timelineChart"></canvas>
                </div>
                <div class="chart-card">
                    <h3>Visit Breakdown</h3>
                    <div class="donut-wrap"><canvas id="typeChart"></canvas></div>
                </div>
            </div>
            <div class="issues-card">
                <h3>Recurring Issues</h3>
                <div class="issues-sub">Patterns spotted in job notes for this truck</div>
                ${renderIssues(jobs)}
            </div>
        </div>`;
    }

    function drawCharts(jobs) {
        destroyCharts();

        // Timeline: group visits by month
        const byMonth = {};
        jobs.forEach(j => {
            if (!j.visit_date) return;
            const d = new Date(j.visit_date);
            if (isNaN(d)) return;
            const key = d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0');
            byMonth[key] = (byMonth[key] || 0) + 1;
        });
        const monthKeys = Object.keys(byMonth).sort();
        const monthLabels = monthKeys.map(k => {
            const parts = k.split('-');
            const y = parts[0], m = parts[1];
            return new Date(y, m - 1, 1).toLocaleDateString('en-GB', { month: 'short', year: '2-digit' });
        });

        const timelineEl = document.getElementById('timelineChart');
        if (timelineEl && monthKeys.length) {
            charts.timeline = new Chart(timelineEl, {
                type: 'bar',
                data: {
                    labels: monthLabels,
                    datasets: [{
                        data: monthKeys.map(k => byMonth[k]),
                        backgroundColor: '#df0a1e',
                        borderRadius: 4,
                        maxBarThickness: 28
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: { legend: { display: false } },
                    scales: {
                        y: { beginAtZero: true, ticks: { precision: 0, font: { size: 10 } }, grid: { color: '#f2f2f2' } },
                        x: { ticks: { font: { size: 10 } }, grid: { display: false } }
                    }
                }
            });
        }

        // Type breakdown donut
        const typeCounts = { 'Breakdown': 0, 'Service / PM': 0, 'Other': 0 };
        jobs.forEach(j => typeCounts[classifyJobType(j.job_type_name)]++);
        const typeEl = document.getElementById('typeChart');
        if (typeEl) {
            charts.type = new Chart(typeEl, {
                type: 'doughnut',
                data: {
                    labels: Object.keys(typeCounts),
                    datasets: [{
                        data: Object.values(typeCounts),
                        backgroundColor: ['#df0a1e', '#4caf50', '#c0c0c0'],
                        borderWidth: 2,
                        borderColor: '#ffffff'
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    cutout: '68%',
                    plugins: {
                        legend: { position: 'bottom', labels: { font: { size: 10.5 }, boxWidth: 10, padding: 12 } }
                    }
                }
            });
        }
    }

    function renderJobs(jobs) {
        const wrap = document.getElementById('resultsWrap');

        if (!jobs.length) {
            wrap.innerHTML = '<div class="empty-state">No jobs found for that serial number.</div>';
            return;
        }

        const distinctSerials = [...new Set(jobs.map(j => j.serial_no).filter(Boolean))];
        const listHtml = `<div class="list-header">Job History</div>` +
            jobs.map((job, i) => `
                <div class="job-card" data-idx="${i}">
                    <div class="job-top">
                        <div class="job-desc">${job.short_desc || 'Job ' + (job.job_id || '')}</div>
                        <div class="job-date">${formatDate(job.visit_date)}</div>
                    </div>
                    <div class="job-meta">
                        <span><strong>Job ID:</strong> ${job.job_id || '—'}</span>
                        <span><strong>Type:</strong> ${job.job_type_name || '—'}</span>
                        <span><strong>Customer:</strong> ${job.customer_name || '—'}</span>
                        <span><strong>Engineer:</strong> ${job.employee || '—'}</span>
                    </div>
                    <div class="job-detail">
                        <div class="detail-label">Equipment</div>
                        <div>${job.serial_no || '—'} ${job.make_model ? '(' + job.make_model + ')' : ''}</div>

                        <div class="detail-label">To Do</div>
                        <div>${job.to_do || '—'}</div>

                        <div class="detail-label">Work Report</div>
                        <div>${job.work_report || '—'}</div>

                        <div class="detail-label">Time On / Off</div>
                        <div>${job.time_on || '—'} &ndash; ${job.time_off || '—'}</div>
                    </div>
                </div>
            `).join('');

        if (distinctSerials.length === 1) {
            wrap.innerHTML = renderInsights(jobs, distinctSerials[0]) +
                `<div class="result-count">${jobs.length} record${jobs.length === 1 ? '' : 's'} found</div>` +
                listHtml;
            drawCharts(jobs);
        } else {
            wrap.innerHTML =
                `<div class="multi-truck-note">Matched ${distinctSerials.length} different serial numbers — showing the list only. Search a full/exact serial to see visual insights for a single truck.</div>` +
                `<div class="result-count">${jobs.length} record${jobs.length === 1 ? '' : 's'} found</div>` +
                listHtml;
        }

        wrap.querySelectorAll('.job-card').forEach(card => {
            card.addEventListener('click', () => card.classList.toggle('expanded'));
        });
    }

    async function runSearch() {
        const serial = document.getElementById('serialInput').value.trim();
        if (!serial) return;

        const btn = document.getElementById('searchBtn');
        btn.disabled = true;
        btn.textContent = 'Searching...';
        document.getElementById('resultsWrap').innerHTML = '<div class="loading-state">Searching job history...</div>';
        destroyCharts();

        try {
            const { data, error } = await db
                .from('Service History')
                .select('*')
                .ilike('serial_no', `%${serial}%`)
                .order('visit_date', { ascending: false });
            if (error) throw error;
            renderJobs(data || []);
        } catch (err) {
            document.getElementById('resultsWrap').innerHTML = '<div class="empty-state">Could not reach Supabase.<br>' + (err.message || err) + '</div>';
        } finally {
            btn.disabled = false;
            btn.textContent = 'Search';
        }
    }

    document.getElementById('searchBtn').addEventListener('click', runSearch);
    document.getElementById('serialInput').addEventListener('keydown', e => {
        if (e.key === 'Enter') runSearch();
    });

    // jump straight into a search when arriving from the dashboard quick search
    const urlParams = new URLSearchParams(window.location.search);
    const serialParam = urlParams.get('serial');
    if (serialParam) {
        document.getElementById('serialInput').value = serialParam;
        runSearch();
    }

    window.addEventListener('pageshow', (event) => {
        if (event.persisted) {
            const s = document.getElementById('serialInput').value.trim();
            if (s) runSearch();
        }
    });
</script>
</body>
</html>
