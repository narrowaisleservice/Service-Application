<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#df0a1e">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;600;700&family=DM+Sans:wght@400;500;700&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<title>Service History - Narrow Aisle Service Portal</title>
<style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { background: white !important; color-scheme: light only; }
    body {
        font-family: 'DM Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        color: #101010;
        min-height: 100vh;
    }

    .header {
        background: linear-gradient(135deg, #ffffff 0%, #fafafa 100%);
        border-bottom: 3px solid #df0a1e;
        padding: 24px 32px;
        position: sticky;
        top: 0;
        z-index: 50;
    }

    .back-link { font-size: 12px; color: #707070; text-decoration: none; font-weight: 600; }
    .back-link:hover { color: #df0a1e; }

    .header-title { font-family: 'IBM Plex Sans', sans-serif; font-size: 28px; font-weight: 700; margin-top: 4px; }
    .header-subtitle { font-size: 13px; color: #707070; margin-top: 2px; }

    .content { max-width: 1000px; margin: 0 auto; padding: 32px; }

    .search-panel {
        background: white;
        border: 1px solid #e8e8e8;
        border-radius: 12px;
        padding: 24px;
        margin-bottom: 24px;
        display: flex;
        gap: 12px;
    }

    .search-panel input {
        flex: 1;
        font-family: 'DM Mono', monospace;
        font-size: 16px;
        padding: 14px 16px;
        border: 1px solid #ddd;
        border-radius: 8px;
        color: #101010;
        text-transform: uppercase;
    }

    .search-panel input:focus { outline: none; border-color: #df0a1e; }

    .search-btn {
        padding: 14px 28px;
        background: #df0a1e;
        border: none;
        border-radius: 8px;
        color: white;
        font-family: 'IBM Plex Sans', sans-serif;
        font-size: 13px;
        font-weight: 700;
        text-transform: uppercase;
        letter-spacing: 0.3px;
        cursor: pointer;
        transition: all 0.2s ease;
    }
    .search-btn:hover { background: #c3161e; }
    .search-btn:disabled { opacity: 0.6; cursor: not-allowed; }

    .result-count {
        font-family: 'DM Mono', monospace;
        font-size: 12px;
        color: #707070;
        margin-bottom: 16px;
        text-transform: uppercase;
        letter-spacing: 0.3px;
    }

    .job-card {
        background: white;
        border: 1px solid #e8e8e8;
        border-left: 4px solid #df0a1e;
        border-radius: 10px;
        padding: 20px 24px;
        margin-bottom: 14px;
        cursor: pointer;
        transition: all 0.2s ease;
    }

    .job-card:hover { box-shadow: 0 8px 24px rgba(223,10,30,0.1); transform: translateY(-2px); }

    .job-top {
        display: flex;
        justify-content: space-between;
        align-items: flex-start;
        gap: 16px;
        margin-bottom: 8px;
    }

    .job-desc { font-family: 'IBM Plex Sans', sans-serif; font-size: 16px; font-weight: 700; }

    .job-date { font-family: 'DM Mono', monospace; font-size: 12px; color: #df0a1e; font-weight: 500; white-space: nowrap; }

    .job-meta { font-size: 13px; color: #707070; display: flex; gap: 16px; flex-wrap: wrap; }
    .job-meta span strong { color: #101010; font-weight: 600; }

    .job-detail {
        display: none;
        margin-top: 16px;
        padding-top: 16px;
        border-top: 1px solid #f0f0f0;
        font-size: 14px;
        line-height: 1.6;
    }

    .job-card.expanded .job-detail { display: block; }

    .detail-label {
        font-family: 'DM Mono', monospace;
        font-size: 10px;
        font-weight: 500;
        color: #606060;
        text-transform: uppercase;
        letter-spacing: 0.5px;
        margin-bottom: 4px;
        margin-top: 12px;
    }
    .detail-label:first-child { margin-top: 0; }

    .empty-state, .loading-state {
        text-align: center;
        padding: 60px 20px;
        color: #909090;
        font-size: 14px;
    }

    @media (max-width: 640px) {
        .header { padding: 16px 20px; }
        .header-title { font-size: 22px; }
        .content { padding: 16px; }
        .search-panel { flex-direction: column; }
        .job-top { flex-direction: column; }
    }
</style>
</head>
<body>

<div class="header">
    <a class="back-link" href="portal-hub-professional.html">&larr; Back to Portal</a>
    <div class="header-title">Service History</div>
    <div class="header-subtitle">Search job history by machine serial number</div>
</div>

<div class="content">
    <div class="search-panel">
        <input type="text" id="serialInput" placeholder="Enter serial number..." autofocus>
        <button class="search-btn" id="searchBtn">Search</button>
    </div>

    <div id="resultsWrap"></div>
</div>

<script>
    if (!localStorage.getItem('portalUser')) {
        window.location.href = 'login.html';
    }

    // ---- Set this to your deployed Apps Script Web App URL ----
    const GAS_URL = 'https://script.google.com/macros/s/AKfycby_pfqEOFZ8MMmroLl1r0E5DtisENHQk2exNCodZtw65FTN2SdiQiVmzQrIg47bC9Ts1Q/exec';

    function formatDate(val) {
        if (!val) return '';
        const d = new Date(val);
        if (isNaN(d)) return val;
        return d.toLocaleDateString('en-GB');
    }

    function renderJobs(jobs) {
        const wrap = document.getElementById('resultsWrap');

        if (!jobs.length) {
            wrap.innerHTML = '<div class="empty-state">No jobs found for that serial number.</div>';
            return;
        }

        wrap.innerHTML = `<div class="result-count">${jobs.length} job${jobs.length === 1 ? '' : 's'} found</div>` +
            jobs.map((job, i) => `
                <div class="job-card" data-idx="${i}">
                    <div class="job-top">
                        <div class="job-desc">${job['ShortDesc'] || 'Job ' + (job['JobID'] || '')}</div>
                        <div class="job-date">${formatDate(job['Date'])}</div>
                    </div>
                    <div class="job-meta">
                        <span><strong>Job ID:</strong> ${job['JobID'] || '—'}</span>
                        <span><strong>Type:</strong> ${job['JobTypeName'] || '—'}</span>
                        <span><strong>Customer:</strong> ${job['CustomerName'] || '—'}</span>
                        <span><strong>Engineer:</strong> ${job['Employee'] || '—'}</span>
                    </div>
                    <div class="job-detail">
                        <div class="detail-label">Equipment</div>
                        <div>${job['Equip'] || '—'} ${job['MakeModel'] ? '(' + job['MakeModel'] + ')' : ''}</div>

                        <div class="detail-label">To Do</div>
                        <div>${job['ToDo'] || '—'}</div>

                        <div class="detail-label">Work Report</div>
                        <div>${job['WorkReport'] || '—'}</div>

                        <div class="detail-label">Time On / Off</div>
                        <div>${job['TimeOn'] || '—'} &ndash; ${job['TimeOff'] || '—'}</div>
                    </div>
                </div>
            `).join('');

        wrap.querySelectorAll('.job-card').forEach(card => {
            card.addEventListener('click', () => card.classList.toggle('expanded'));
        });
    }

    function runSearch() {
        const serial = document.getElementById('serialInput').value.trim();
        if (!serial) return;

        const btn = document.getElementById('searchBtn');
        btn.disabled = true;
        btn.textContent = 'Searching...';
        document.getElementById('resultsWrap').innerHTML = '<div class="loading-state">Searching job history...</div>';

        fetch(`${GAS_URL}?serial=${encodeURIComponent(serial)}`)
            .then(r => r.json())
            .then(res => {
                if (res.success) {
                    renderJobs(res.jobs);
                } else {
                    document.getElementById('resultsWrap').innerHTML = '<div class="empty-state">' + (res.error || 'Something went wrong') + '</div>';
                }
            })
            .catch(() => {
                document.getElementById('resultsWrap').innerHTML = '<div class="empty-state">Could not reach the server.</div>';
            })
            .finally(() => {
                btn.disabled = false;
                btn.textContent = 'Search';
            });
    }

    document.getElementById('searchBtn').addEventListener('click', runSearch);
    document.getElementById('serialInput').addEventListener('keydown', e => {
        if (e.key === 'Enter') runSearch();
    });
</script>
</body>
</html>
