<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
   <script>window.ALLOWED_ROLES = ['internal', 'dealer'];</script>
<script type="module" src="auth-guard.js"></script>
<meta name="theme-color" content="#df0a1e">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;600;700&family=DM+Sans:wght@400;500;700&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<title>Documents - Narrow Aisle Service Portal</title>
<style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { background: white !important; color-scheme: light only; }
    body {
        font-family: 'DM Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        color: #101010;
        min-height: 100vh;
    }

    .header {
        background: linear-gradient(135deg, #ffffff 0%, #fafafa 100%);
        border-bottom: 3px solid #df0a1e;
        padding: 24px 32px;
        position: sticky;
        top: 0;
        z-index: 50;
    }

    .back-link { font-size: 12px; color: #707070; text-decoration: none; font-weight: 600; }
    .back-link:hover { color: #df0a1e; }

    .header-title { font-family: 'IBM Plex Sans', sans-serif; font-size: 28px; font-weight: 700; margin-top: 4px; }
    .header-subtitle { font-size: 13px; color: #707070; margin-top: 2px; }

    .content { max-width: 1100px; margin: 0 auto; padding: 32px; }

    .search-panel { margin-bottom: 24px; }

    .search-panel input {
        width: 100%;
        font-family: 'DM Sans', sans-serif;
        font-size: 14px;
        padding: 14px 16px;
        border: 1px solid #ddd;
        border-radius: 8px;
        color: #101010;
    }
    .search-panel input:focus { outline: none; border-color: #df0a1e; }

    .result-count {
        font-family: 'DM Mono', monospace;
        font-size: 12px;
        color: #707070;
        margin-bottom: 16px;
        text-transform: uppercase;
        letter-spacing: 0.3px;
    }

    .doc-grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
        gap: 16px;
    }

    .doc-card {
        background: white;
        border: 1px solid #e8e8e8;
        border-radius: 12px;
        padding: 20px;
        cursor: pointer;
        transition: all 0.2s ease;
        display: flex;
        flex-direction: column;
        gap: 10px;
    }

    .doc-card:hover {
        border-color: #df0a1e;
        transform: translateY(-4px);
        box-shadow: 0 12px 24px rgba(223,10,30,0.12);
    }

    .doc-icon { font-size: 26px; }

    .doc-title {
        font-family: 'IBM Plex Sans', sans-serif;
        font-size: 15px;
        font-weight: 700;
        line-height: 1.3;
        word-break: break-word;
    }

    .doc-type {
        font-family: 'DM Mono', monospace;
        font-size: 10px;
        font-weight: 500;
        color: #707070;
        text-transform: uppercase;
        letter-spacing: 0.5px;
    }

    .empty-state, .loading-state, .error-state {
        text-align: center;
        padding: 60px 20px;
        color: #909090;
        font-size: 14px;
    }
    .error-state { color: #df0a1e; }

    /* Document viewer modal */
    .doc-modal {
        display: none;
        position: fixed;
        inset: 0;
        background: rgba(0,0,0,0.7);
        z-index: 300;
        flex-direction: column;
    }
    .doc-modal.show { display: flex; }

    .doc-modal-header {
        background: white;
        padding: 16px 24px;
        display: flex;
        justify-content: space-between;
        align-items: center;
        border-bottom: 3px solid #df0a1e;
    }

    .doc-modal-title { font-family: 'IBM Plex Sans', sans-serif; font-size: 16px; font-weight: 700; }

    .doc-modal-actions { display: flex; gap: 12px; align-items: center; }

    .doc-download-link {
        font-size: 12px;
        font-weight: 600;
        color: #df0a1e;
        text-decoration: none;
    }

    .doc-close {
        background: #df0a1e;
        border: none;
        color: white;
        width: 32px;
        height: 32px;
        border-radius: 6px;
        font-size: 18px;
        cursor: pointer;
        line-height: 1;
    }

    .doc-modal iframe {
        flex: 1;
        border: none;
        background: #525659;
    }

    @media (max-width: 640px) {
        .header { padding: 16px 20px; }
        .header-title { font-size: 22px; }
        .content { padding: 16px; }
    }
</style>
</head>
<body>

<div class="header">
    <a class="back-link" href="portal-hub-professional.html">&larr; Back to Portal</a>
    <div class="header-title" id="pageTitle">Documents</div>
    <div class="header-subtitle" id="pageSubtitle">Browse documents</div>
</div>

<div class="content">
    <div class="search-panel">
        <input type="text" id="searchInput" placeholder="Search documents...">
    </div>
    <div class="result-count" id="resultCount"></div>
    <div class="doc-grid" id="docGrid">
        <div class="loading-state">Loading documents...</div>
    </div>
</div>

<div class="doc-modal" id="docModal">
    <div class="doc-modal-header">
        <div class="doc-modal-title" id="docModalTitle">Document</div>
        <div class="doc-modal-actions">
            <a class="doc-download-link" id="docDownloadLink" href="#" target="_blank">Download original</a>
            <button class="doc-close" id="docClose">&times;</button>
        </div>
    </div>
    <iframe id="docFrame" src=""></iframe>
</div>

<script>
    if (!localStorage.getItem('portalUser')) {
        window.location.href = 'login.html';
    }

    // Page is driven by URL params, e.g.
    // doc-library.html?folder=coshh&title=COSHH+Sheets&subtitle=Chemical+safety+information&icon=☠️
    // Optional &repo=SomeOtherRepo to pull from a repo other than the default below.
    const params = new URLSearchParams(window.location.search);
    const folder = params.get('folder') || '';
    const pageTitle = params.get('title') || 'Documents';
    const pageSubtitle = params.get('subtitle') || 'Browse documents';
    const defaultIcon = params.get('icon') || '📄';

    // ── Configure this to match your repo ──
    const GITHUB_OWNER = 'narrowaisleservice';
    const GITHUB_REPO = params.get('repo') || 'hs-docs';

    document.getElementById('pageTitle').textContent = pageTitle;
    document.getElementById('pageSubtitle').textContent = pageSubtitle;
    document.title = pageTitle + ' - Narrow Aisle Service Portal';

    let allDocs = [];
    // Cache resolved HTML titles so we don't re-fetch every time the grid re-renders (e.g. on search)
    const titleCache = {};

    function iconFor(filename) {
        const ext = filename.split('.').pop().toLowerCase();
        if (ext === 'pdf') return '📕';
        if (ext === 'doc' || ext === 'docx') return defaultIcon;
        if (ext === 'xls' || ext === 'xlsx') return '📊';
        return '📎';
    }

    function cleanTitle(filename) {
        return filename.replace(/\.[^/.]+$/, '').replace(/[-_]+/g, ' ').trim();
    }

    // Pulls the real document name out of a page's <title> tag, e.g.
    // "2026-020 – Use of Ladders and Steps | Narrow Aisle Ltd Risk Assessment"
    // becomes "Use of Ladders and Steps"
    function extractTitleFromHtml(html) {
        const match = html.match(/<title>([^<]*)<\/title>/i);
        if (!match) return null;
        let title = match[1].split('–').pop().split('|')[0].trim();
        return title || null;
    }

    function renderDocs(list) {
        const grid = document.getElementById('docGrid');
        document.getElementById('resultCount').textContent = `${list.length} document${list.length === 1 ? '' : 's'}`;

        if (!list.length) {
            grid.innerHTML = '<div class="empty-state">No documents found.</div>';
            return;
        }

        grid.innerHTML = list.map(d => {
            const ext = d.name.split('.').pop().toLowerCase();
            const title = (ext === 'html' && titleCache[d.name]) ? titleCache[d.name] : cleanTitle(d.name);
            return `
            <div class="doc-card" data-url="${d.download_url}" data-title="${title}" data-ext="${ext}" data-name="${d.name}">
                <div class="doc-icon">${iconFor(d.name)}</div>
                <div class="doc-title">${title}</div>
                <div class="doc-type">.${ext.toUpperCase()}</div>
            </div>
        `;
        }).join('');

        grid.querySelectorAll('.doc-card').forEach(card => {
            card.addEventListener('click', () => {
                const officeExts = ['doc', 'docx', 'xls', 'xlsx', 'ppt', 'pptx'];
                if (officeExts.includes(card.dataset.ext)) {
                    openDoc(card.dataset.url, card.dataset.title);
                } else if (card.dataset.ext === 'html') {
                    // raw.githubusercontent.com always serves files as text/plain,
                    // so opening the raw URL directly shows source code instead of
                    // rendering it. Open a blank tab immediately (so the popup isn't
                    // blocked), then fetch the content and write it in so it renders.
                    const win = window.open('', '_blank');
                    fetch(card.dataset.url)
                        .then(r => r.text())
                        .then(html => {
                            const withBase = html.replace(/<head>/i, `<head><base href="${card.dataset.url}">`);
                            win.document.open();
                            win.document.write(withBase);
                            win.document.close();
                        })
                        .catch(() => {
                            win.location.href = card.dataset.url; // fallback if fetch fails
                        });
                } else {
                    // PDFs, etc. render natively when the browser opens them directly.
                    window.open(card.dataset.url, '_blank');
                }
            });
        });

        // Upgrade HTML docs with their real in-file title, then re-render once resolved
        grid.querySelectorAll('.doc-card[data-ext="html"]').forEach(card => {
            const name = card.dataset.name;
            if (titleCache[name]) return; // already resolved
            fetch(card.dataset.url)
                .then(r => r.text())
                .then(html => {
                    const realTitle = extractTitleFromHtml(html);
                    if (realTitle) {
                        titleCache[name] = realTitle;
                        card.dataset.title = realTitle;
                        card.querySelector('.doc-title').textContent = realTitle;
                    }
                })
                .catch(() => {}); // silent fallback to filename if fetch fails
        });
    }

    function openDoc(url, title) {
        document.getElementById('docModalTitle').textContent = title;
        document.getElementById('docDownloadLink').href = url;
        document.getElementById('docFrame').src = `https://view.officeapps.live.com/op/embed.aspx?src=${encodeURIComponent(url)}`;
        document.getElementById('docModal').classList.add('show');
    }

    document.getElementById('docClose').addEventListener('click', () => {
        document.getElementById('docModal').classList.remove('show');
        document.getElementById('docFrame').src = '';
    });

    document.getElementById('searchInput').addEventListener('input', function () {
        const term = this.value.trim().toLowerCase();
        const filtered = term
            ? allDocs.filter(d => {
                const ext = d.name.split('.').pop().toLowerCase();
                const resolvedTitle = (ext === 'html' && titleCache[d.name]) ? titleCache[d.name] : cleanTitle(d.name);
                return d.name.toLowerCase().includes(term) || resolvedTitle.toLowerCase().includes(term);
            })
            : allDocs;
        renderDocs(filtered);
    });

    if (!folder) {
        document.getElementById('docGrid').innerHTML = '<div class="error-state">No folder specified. Link to this page with ?folder=coshh (etc).</div>';
    } else {
        fetch(`https://api.github.com/repos/${GITHUB_OWNER}/${GITHUB_REPO}/contents/${folder}`)
            .then(r => r.json())
            .then(res => {
                if (!Array.isArray(res)) {
                    document.getElementById('docGrid').innerHTML =
                        `<div class="error-state">${res.message || 'Could not load that folder.'}</div>`;
                    return;
                }
                allDocs = res.filter(item => item.type === 'file');
                renderDocs(allDocs);
            })
            .catch(() => {
                document.getElementById('docGrid').innerHTML = '<div class="error-state">Could not reach GitHub.</div>';
            });
    }
</script>
</body>
</html>
